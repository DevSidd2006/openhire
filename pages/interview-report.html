<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Interview Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: #f8f9fa;
  }

  .report-container {
    max-width: 1000px;
    margin: 2rem auto;
    padding: 0 1rem;
  }

  .report-header {
    background: white;
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 2rem;
    margin-bottom: 2rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .candidate-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 1.5rem;
  }

  .candidate-name {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text-main);
  }

  .candidate-role {
    color: var(--text-muted);
    font-size: 1rem;
  }

  .interview-date {
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  .recommendation-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
  }

  .recommendation-strong-yes {
    background: rgba(16, 185, 129, 0.15);
    color: #059669;
    border: 1px solid rgba(16, 185, 129, 0.3);
  }

  .recommendation-yes {
    background: rgba(34, 197, 94, 0.15);
    color: #16a34a;
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .recommendation-maybe {
    background: rgba(250, 204, 21, 0.15);
    color: #d97706;
    border: 1px solid rgba(250, 204, 21, 0.3);
  }

  .recommendation-no {
    background: rgba(239, 68, 68, 0.15);
    color: #dc2626;
    border: 1px solid rgba(239, 68, 68, 0.3);
  }

  .recommendation-strong-no {
    background: rgba(239, 68, 68, 0.2);
    color: #991b1b;
    border: 1px solid rgba(239, 68, 68, 0.4);
  }

  .score-card {
    background: white;
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }

  .score-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-top: 1rem;
  }

  .score-item {
    background: var(--bg);
    padding: 1rem;
    border-radius: 8px;
    border-left: 4px solid var(--primary);
  }

  .score-label {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-bottom: 0.5rem;
  }

  .score-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--primary);
  }

  .score-subtext {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.25rem;
  }

  .competency-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .competency-bar {
    background: var(--bg);
    padding: 1rem;
    border-radius: 8px;
    border-left: 4px solid #3b82f6;
  }

  .competency-name {
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 0.5rem;
    font-size: 0.95rem;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background: rgba(59, 130, 246, 0.1);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #06b6d4);
    transition: width 0.3s ease;
  }

  .score-percentage {
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--primary);
    margin-top: 0.5rem;
  }

  .feedback-section {
    margin-top: 2rem;
  }

  .feedback-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--surface-border);
  }

  .feedback-list {
    list-style: none;
    padding: 0;
    margin: 1rem 0;
  }

  .feedback-item {
    background: var(--bg);
    padding: 1rem;
    margin-bottom: 0.75rem;
    border-radius: 8px;
    border-left: 4px solid var(--primary);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .feedback-icon {
    font-size: 1.2rem;
  }

  .feedback-text {
    color: var(--text-main);
    flex: 1;
  }

  .rationale-box {
    background: rgba(59, 130, 246, 0.08);
    border: 1px solid rgba(59, 130, 246, 0.25);
    border-radius: 8px;
    padding: 1rem;
    margin-top: 1rem;
    color: var(--text-main);
    line-height: 1.6;
  }

  .button-group {
    display: flex;
    gap: 1rem;
    margin-top: 2rem;
  }

  .btn {
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-size: 0.95rem;
    transition: all 0.2s ease;
  }

  .btn-primary {
    background: var(--primary);
    color: white;
  }

  .btn-primary:hover {
    opacity: 0.9;
  }

  .btn-secondary {
    background: var(--bg);
    color: var(--text-main);
    border: 1px solid var(--surface-border);
  }

  .btn-secondary:hover {
    background: var(--surface-border);
  }

  .loading {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
  }

  .spinner {
    display: inline-block;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(59, 130, 246, 0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>
<div id="navbarContainer"></div>

<div class="report-container">
  <div id="reportContent" style="display:none;">
    <!-- Header -->
    <div class="report-header">
      <div class="candidate-info">
        <div>
          <div class="candidate-name" id="candidateName">—</div>
          <div class="candidate-role" id="jobTitle">—</div>
          <div class="interview-date" id="interviewDate">—</div>
        </div>
        <div class="recommendation-badge" id="recommendationBadge">
          <span id="recommendationText">Loading...</span>
        </div>
      </div>

      <!-- Overall Score -->
      <div class="score-card">
        <div style="font-weight: 600; margin-bottom: 1rem;">Interview Score Breakdown</div>
        <div class="score-row">
          <div class="score-item">
            <div class="score-label">Overall Score</div>
            <div class="score-value" id="overallScore">—</div>
            <div class="score-subtext" id="scoreInterpretation">—</div>
          </div>
          <div class="score-item">
            <div class="score-label">Clarity</div>
            <div class="score-value" id="avgClarity">—</div>
            <div class="score-subtext">Communication Quality</div>
          </div>
          <div class="score-item">
            <div class="score-label">Completeness</div>
            <div class="score-value" id="avgCompleteness">—</div>
            <div class="score-subtext">Answer Depth</div>
          </div>
          <div class="score-item">
            <div class="score-label">Relevance</div>
            <div class="score-value" id="avgRelevance">—</div>
            <div class="score-subtext">Job Fit</div>
          </div>
        </div>
      </div>

      <!-- Competency Scores -->
      <div class="score-card">
        <div style="font-weight: 600; margin-bottom: 1rem;">Competency Scores</div>
        <div class="competency-grid" id="competencyGrid">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <!-- Strengths -->
    <div class="score-card feedback-section">
      <div class="feedback-title">✨ Strengths</div>
      <ul class="feedback-list" id="strengthsList">
        <!-- Populated dynamically -->
      </ul>
    </div>

    <!-- Areas for Improvement -->
    <div class="score-card feedback-section">
      <div class="feedback-title">🎯 Areas for Improvement</div>
      <ul class="feedback-list" id="improvementsList">
        <!-- Populated dynamically -->
      </ul>
    </div>

    <!-- Recommendation Rationale -->
    <div class="score-card">
      <div style="font-weight: 600; margin-bottom: 0.75rem;">Recommendation Rationale</div>
      <div class="rationale-box" id="rationaleBox">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Actions -->
    <div class="button-group">
      <button class="btn btn-primary" onclick="exportReport('json')">📥 Export JSON</button>
      <button class="btn btn-secondary" onclick="window.history.back()">← Back</button>
    </div>
  </div>

  <!-- Loading State -->
  <div id="loadingContent">
    <div class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 1rem;">Loading interview report...</p>
    </div>
  </div>

  <!-- Error State -->
  <div id="errorContent" style="display:none;">
    <div class="score-card">
      <div style="color: var(--danger); font-weight: 600;">Error Loading Report</div>
      <p id="errorMessage" style="margin-top: 1rem; color: var(--text-muted);"></p>
      <button class="btn btn-secondary" onclick="window.history.back()">← Back</button>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  guardAuthenticatedPage();
  renderNavbar();

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get("session_id");

  if (!sessionId) {
    showError("No session ID provided");
  } else {
    loadReport(sessionId);
  }

  async function loadReport(sessionId) {
    try {
      const response = await fetch(`${API_BASE}/reports/session/${sessionId}`);
      if (!response.ok) throw new Error("Report not found");

      const report = await response.json();
      displayReport(report);
    } catch (err) {
      showError(err.message);
    }
  }

  function displayReport(report) {
    // Hide loading, show report
    document.getElementById("loadingContent").style.display = "none";
    document.getElementById("reportContent").style.display = "block";

    // Populate header
    document.getElementById("candidateName").textContent = report.candidate_name;
    document.getElementById("jobTitle").textContent = report.job_title;
    document.getElementById("interviewDate").textContent = new Date(report.interview_date).toLocaleDateString();

    // Recommendation badge
    const badge = document.getElementById("recommendationBadge");
    const recClass = `recommendation-${report.recommendation.replace(/_/g, "-")}`;
    badge.className = `recommendation-badge ${recClass}`;
    document.getElementById("recommendationText").textContent = formatRecommendation(report.recommendation);

    // Scores
    document.getElementById("overallScore").textContent = `${report.overall_score}%`;
    document.getElementById("scoreInterpretation").textContent = getScoreInterpretation(report.overall_score);
    document.getElementById("avgClarity").textContent = `${report.average_clarity.toFixed(1)}/10`;
    document.getElementById("avgCompleteness").textContent = `${report.average_completeness.toFixed(1)}/10`;
    document.getElementById("avgRelevance").textContent = `${report.average_relevance.toFixed(1)}/10`;

    // Competency scores
    const competencyGrid = document.getElementById("competencyGrid");
    competencyGrid.innerHTML = Object.entries(report.competency_scores)
      .map(([comp, score]) => `
        <div class="competency-bar">
          <div class="competency-name">${comp}</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width: ${score}%"></div>
          </div>
          <div class="score-percentage">${score}%</div>
        </div>
      `).join("");

    // Strengths
    document.getElementById("strengthsList").innerHTML = report.strengths
      .map(s => `<li class="feedback-item"><span class="feedback-icon">✓</span><span class="feedback-text">${s}</span></li>`)
      .join("");

    // Improvements
    document.getElementById("improvementsList").innerHTML = report.areas_for_improvement
      .map(a => `<li class="feedback-item"><span class="feedback-icon">→</span><span class="feedback-text">${a}</span></li>`)
      .join("");

    // Rationale
    document.getElementById("rationaleBox").textContent = report.recommendation_rationale;
  }

  function formatRecommendation(rec) {
    const map = {
      "strong_yes": "🎉 Strong Yes",
      "yes": "✓ Yes",
      "maybe": "? Maybe",
      "no": "✗ No",
      "strong_no": "🚫 Strong No",
    };
    return map[rec] || rec;
  }

  function getScoreInterpretation(score) {
    if (score >= 85) return "Excellent";
    if (score >= 70) return "Good";
    if (score >= 55) return "Adequate";
    if (score >= 40) return "Below Average";
    return "Poor";
  }

  function showError(message) {
    document.getElementById("loadingContent").style.display = "none";
    document.getElementById("errorContent").style.display = "block";
    document.getElementById("errorMessage").textContent = message;
  }

  async function exportReport(format) {
    try {
      const sessionId = new URLSearchParams(window.location.search).get("session_id");
      const response = await fetch(`${API_BASE}/reports/export/${sessionId}?format=${format}`);
      const data = await response.json();

      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `interview-report-${sessionId}.json`;
      a.click();
    } catch (err) {
      alert("Error exporting report: " + err.message);
    }
  }
</script>
</body>
</html>
