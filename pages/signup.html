<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-shell {
    min-height: calc(100vh - 64px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1.25rem;
  }
  .auth-card {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .auth-mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--primary-subtle);
    border: 1px solid var(--primary-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
  }
  .auth-mark .brand-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary-glow);
  }
  .auth-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text-main);
    margin: 0 0 0.4rem;
  }
  .auth-sub {
    color: var(--text-muted);
    font-size: 0.875rem;
    margin: 0 0 1.9rem;
  }
  .auth-form {
    width: 100%;
    text-align: left;
  }
  .auth-form .form-group { margin-bottom: 0.9rem; }
  .auth-form .form-label {
    font-family: var(--font-sans);
    text-transform: none;
    letter-spacing: 0;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 0.4rem;
  }
  .auth-form .form-control {
    border-radius: 999px;
    padding: 0.7rem 1.1rem;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-form .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-subtle);
  }
  .auth-role-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }
  .auth-role-option {
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-lg);
    padding: 0.65rem 0.5rem;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--surface);
  }
  .auth-role-option:hover { border-color: var(--surface-border-light); }
  .auth-role-option.selected {
    border-color: var(--primary);
    color: var(--text-main);
    background: var(--primary-subtle);
    box-shadow: 0 0 0 3px var(--primary-subtle);
  }
  .auth-submit {
    width: 100%;
    border-radius: 999px;
    padding: 0.75rem 1rem;
    margin-top: 0.6rem;
    font-size: 14px;
  }
  .auth-error {
    width: 100%;
    border-radius: var(--radius);
    text-align: left;
  }
  .auth-footer {
    margin-top: 1.6rem;
    font-size: 0.85rem;
    color: var(--text-muted);
  }
  .auth-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
  }
  .auth-footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-mark"><span class="brand-dot"></span></div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Sign up to start using OpenHire.</p>

    <div id="errorMessage" class="alert alert-danger auth-error" style="display:none; margin-bottom:1rem;"></div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleSignupSubmit();">
      <div class="form-group">
        <label class="form-label">I am a</label>
        <div class="auth-role-group">
          <div class="auth-role-option" id="roleCandidate" onclick="selectRole('candidate')">Candidate</div>
          <div class="auth-role-option" id="roleRecruiter" onclick="selectRole('recruiter')">Recruiter</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" autocomplete="new-password">
      </div>

      <button id="submitBtn" type="submit" class="btn-primary auth-submit">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  renderNavbar();

  let selectedRole = '';

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('roleCandidate').classList.toggle('selected', role === 'candidate');
    document.getElementById('roleRecruiter').classList.toggle('selected', role === 'recruiter');
  }

  async function handleSignupSubmit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const userRole = selectedRole;
    const errorDiv = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Validation
    if (!email || !password || !confirmPassword || !userRole) {
      errorDiv.textContent = 'Please fill in all fields.';
      errorDiv.style.display = 'block';
      return;
    }

    if (!email.includes('@')) {
      errorDiv.textContent = 'Please enter a valid email address.';
      errorDiv.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Password must be at least 6 characters long.';
      errorDiv.style.display = 'block';
      return;
    }

    if (password !== confirmPassword) {
      errorDiv.textContent = 'Passwords do not match.';
      errorDiv.style.display = 'block';
      return;
    }

    if (userRole !== 'candidate' && userRole !== 'recruiter') {
      errorDiv.textContent = 'Please select a valid account type.';
      errorDiv.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    errorDiv.style.display = 'none';

    try {
      const response = await apiRequest('/auth/signup', {
        method: 'POST',
        body: {
          email,
          password,
          user_type: userRole,
        },
      });

      // Store tokens and user info
      setTokens(response.access_token, response.refresh_token);
      setCurrentUser({
        name: response.user.email,
        role: response.user.user_type,
        user_id: response.user.user_id,
      });

      // Redirect to appropriate dashboard
      const dashboard = response.user.user_type === 'recruiter' ? 'recruiter.html' : 'candidate.html';
      window.location.href = dashboard;
    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      errorDiv.textContent = error.message || 'Sign up failed. Please try again.';
      errorDiv.style.display = 'block';
    }
  }
</script>
</body>
</html>
