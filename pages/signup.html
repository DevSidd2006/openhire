<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(1rem, 4vw, 2.5rem);
    background: rgba(247, 246, 243, 0.85);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--surface-border);
  }
  .site-nav .brand,
  .site-nav .links a {
    color: var(--ink);
    text-decoration: none;
  }
  .site-nav .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .mark-tile {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mark-tile img { width: 24px; height: 24px; }
  .site-nav .links,
  .site-nav .right {
    display: flex;
    align-items: center;
  }
  .site-nav .links { gap: 0.35rem; }
  .site-nav .links a {
    color: var(--ink-3);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.4rem 0.85rem;
    border-radius: var(--radius);
  }
  .site-nav .right { gap: 0.9rem; }
  .site-nav .github-link {
    color: var(--ink-2);
    text-decoration: none;
    display: inline-flex;
  }
  .site-nav .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 1.4rem;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-size: 0.86rem;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    .site-nav .links { display: none; }
  }
  @media (max-width: 420px) {
    .site-nav .github-link { display: none; }
  }
  .auth-role-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.6rem;
  }
  .auth-role-option {
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    padding: 0.75rem 0.5rem;
    text-align: center;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--ink-3);
    cursor: pointer;
    transition: border-color var(--transition-fast), color var(--transition-fast),
                background var(--transition-fast), transform 120ms var(--ease-out);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .auth-role-option:hover { border-color: var(--surface-border-light); color: var(--ink); }
  .auth-role-option:active { transform: scale(0.98); }
  .auth-role-option.selected {
    border-color: var(--ink);
    color: var(--ink);
    background: var(--surface-elevated);
  }
  .auth-role-option i { font-size: 1.05rem; color: var(--ink-3); }
  .auth-role-option.selected i { color: var(--ink); }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="index.html" class="brand">
    <span class="mark-tile"><img src="assets/openhire.svg" alt="OpenHire logo"></span>
    OpenHire
  </a>
  <div class="links">
    <a href="index.html#how">How it works</a>
    <a href="index.html#features">Features</a>
  </div>
  <div class="right">
    <a class="github-link" href="https://github.com/DevSidd2006/openhire" aria-label="OpenHire on GitHub"><i class="ph-bold ph-github-logo" aria-hidden="true"></i></a>
    <a href="login.html" class="btn btn-primary"><i class="ph-bold ph-arrow-right" aria-hidden="true"></i>Get Started</a>
  </div>
</nav>
<div id="impersonationBanner"></div>

<main class="auth-shell">
  <div class="auth-card reveal">
    <div class="auth-mark">
      <img src="assets/openhire.svg" alt="OpenHire logo">
    </div>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Sign up to start using OpenHire.</p>

    <div id="errorMessage" class="alert alert-danger auth-error" style="display:none; margin-bottom:1rem;"></div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleSignupSubmit();">
      <div class="form-group">
        <label class="form-label">I am a</label>
        <div class="auth-role-group">
          <div class="auth-role-option" id="roleCandidate" onclick="selectRole('candidate')"><i class="ph-bold ph-user"></i>Candidate</div>
          <div class="auth-role-option" id="roleRecruiter" onclick="selectRole('recruiter')"><i class="ph-bold ph-briefcase"></i>Recruiter</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="At least 6 characters" autocomplete="new-password">
      </div>

      <div class="form-group">
        <label class="form-label">Confirm password</label>
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm your password" autocomplete="new-password">
      </div>

      <button id="submitBtn" type="submit" class="btn-primary auth-submit">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </p>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  let selectedRole = '';

  function selectRole(role) {
    selectedRole = role;
    document.getElementById('roleCandidate').classList.toggle('selected', role === 'candidate');
    document.getElementById('roleRecruiter').classList.toggle('selected', role === 'recruiter');
  }

  async function handleSignupSubmit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const userRole = selectedRole;
    const errorDiv = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Validation
    if (!email || !password || !confirmPassword || !userRole) {
      errorDiv.textContent = 'Please fill in all fields.';
      errorDiv.style.display = 'block';
      return;
    }

    if (!email.includes('@')) {
      errorDiv.textContent = 'Please enter a valid email address.';
      errorDiv.style.display = 'block';
      return;
    }

    if (password.length < 6) {
      errorDiv.textContent = 'Password must be at least 6 characters long.';
      errorDiv.style.display = 'block';
      return;
    }

    if (password !== confirmPassword) {
      errorDiv.textContent = 'Passwords do not match.';
      errorDiv.style.display = 'block';
      return;
    }

    if (userRole !== 'candidate' && userRole !== 'recruiter') {
      errorDiv.textContent = 'Please select a valid account type.';
      errorDiv.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account...';
    errorDiv.style.display = 'none';

    try {
      const response = await apiRequest('/auth/signup', {
        method: 'POST',
        body: {
          email,
          password,
          user_type: userRole,
        },
      });

      // Store tokens and user info
      setTokens(response.access_token, response.refresh_token);
      setCurrentUser({
        name: response.user.email,
        role: response.user.user_type,
        user_id: response.user.user_id,
      });

      // Redirect to appropriate dashboard
      const dashboard = response.user.user_type === 'recruiter' ? 'recruiter.html' : 'candidate.html';
      window.location.href = dashboard;
    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create Account';
      errorDiv.textContent = error.message || 'Sign up failed. Please try again.';
      errorDiv.style.display = 'block';
    }
  }
</script>
</body>
</html>
