<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Recruiter Hub</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="card-header">
    <div>
      <h2 class="card-title">Recruiter Dashboard</h2>
      <p class="card-sub">Post job descriptions, review shortlists generated by <code>ResumeMatcherAgent</code>, and inspect candidates.</p>
    </div>
    <button class="btn-primary" onclick="window.location.href='create-job.html'">+ Post New Job</button>
  </div>

  <div class="card" style="margin-top:1.5rem;">
    <h3 class="card-title" style="font-size:1.1rem; margin-bottom:1rem;">Active Job Postings</h3>
    <div id="recruiterJobList" class="grid-2">
      <!-- Loaded dynamically -->
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar('dashboard');

  const jobs = getStoredJobs();
  const listEl = document.getElementById('recruiterJobList');

  listEl.innerHTML = jobs.map(job => `
    <div class="job-card" onclick="window.location.href='job-detail.html?job_id=${encodeURIComponent(job.job_id)}'">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem;">
        <h4 style="font-weight:700; font-size:1.05rem;">${job.title || job.job_id}</h4>
        <span class="tag">ID: ${job.job_id}</span>
      </div>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.85rem;">
        ${(job.description || '').substring(0, 110)}...
      </p>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; gap:0.35rem; flex-wrap:wrap;">
          ${(job.competencies || ['Technical Assessment']).slice(0, 3).map(c => `<span class="tag">${c}</span>`).join('')}
        </div>
        <button class="btn-outline" style="padding:0.3rem 0.75rem; font-size:0.8rem;" onclick="event.stopPropagation(); window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'">
          Leaderboard 🏆
        </button>
      </div>
    </div>
  `).join('');
</script>
</body>
</html>
