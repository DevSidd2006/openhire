<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Recruiter Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="container">
  <div class="page-head reveal">
    <div class="eyebrow">workspace / recruiter</div>
    <h1 class="page-title">Recruiter Dashboard</h1>
    <p class="page-sub">Post positions, manage shortlists, and inspect candidate evaluation evidence.</p>
  </div>

  <div class="page-actions reveal" style="margin-bottom:1.5rem;">
    <button class="btn-primary" onclick="window.location.href='create-job.html'"><i class="ph-bold ph-plus"></i>Post Job</button>
  </div>

  <div class="card reveal">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.15rem;">Active Postings</h3>
      <span class="chip chip-info"><i class="ph-fill ph-dot" style="font-size:0.8em;"></i>Live Roles</span>
    </div>
    <div id="recruiterJobList" class="grid-2" style="margin-top:0.25rem;">
      <!-- Dynamic -->
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  guardAuthenticatedPage();
  renderNavbar('dashboard');

  const listEl = document.getElementById('recruiterJobList');
  listEl.innerHTML = '<p class="card-sub">Loading postings…</p>';

  (async () => {
    let jobs;
    try {
      jobs = await fetchJobs();
    } catch (err) {
      listEl.innerHTML = `<p class="card-sub" style="color:var(--danger-text);">Could not load jobs: ${err.message}</p>`;
      return;
    }

    if (!jobs.length) {
      listEl.innerHTML = '<div class="empty-state"><div class="empty-icon"><i class="ph-bold ph-briefcase" aria-hidden="true"></i></div><div class="empty-title">No postings yet</div><p>Click "Post Job" to create your first role.</p></div>';
      return;
    }

    listEl.innerHTML = jobs.map(job => `
      <div class="job-card reveal" onclick="window.location.href='job-detail.html?job_id=${encodeURIComponent(job.job_id)}'">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.5rem;">
          <h4 style="font-weight:600; font-size:1.02rem; letter-spacing:-0.01em;">${job.title || job.job_id}</h4>
          <span class="tag">${job.job_id}</span>
        </div>
        <p style="font-size:0.85rem; color:var(--ink-3); margin-bottom:0.85rem; line-height:1.55;">
          ${(job.description || '').substring(0, 100)}...
        </p>
        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; flex-wrap:wrap;">
          <div style="display:flex; gap:0.3rem; flex-wrap:wrap;">
            ${(job.competencies || ['Technical']).slice(0, 3).map(c => `<span class="tag">${c}</span>`).join('')}
          </div>
          <div style="display:flex; gap:0.35rem;">
            <button class="btn-sm btn-secondary" onclick="event.stopPropagation(); window.location.href='screening.html?job_id=${encodeURIComponent(job.job_id)}'">
              <i class="ph-bold ph-file-text"></i>Screening
            </button>
            <button class="btn-sm btn-outline" onclick="event.stopPropagation(); window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'">
              <i class="ph-bold ph-ranking"></i>Leaderboard
            </button>
          </div>
        </div>
      </div>
    `).join('');
  })();
</script>
</body>
</html>
