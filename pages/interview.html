<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Interview</title>
<link rel="icon" type="image/svg+xml" href="assets/openhire.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css?v=theme-toggle">
<script src="js/theme.js"></script>
<style>
  body {
    background: var(--canvas);
    overflow: hidden;
    margin: 0;
    padding: 0;
    height: 100vh;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem 1rem;
    padding-right: 320px;
    position: relative;
  }

  @media (max-width: 900px) {
    main { padding-right: 1rem; }
    #transcriptPanel { display: none; }
  }

  .interview-header {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-family: var(--font-mono);
    color: var(--ink-3);
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-pill);
    padding: 0.4rem 0.85rem;
  }
  .interview-header .mark {
    width: 20px;
    height: 20px;
    border-radius: var(--radius-sm);
    background: var(--ink);
    color: var(--surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .interview-header .mark svg { width: 12px; height: 12px; }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .avatar-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    width: 100%;
    max-width: 900px;
    flex: 1;
    justify-content: center;
  }

  .participant {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .avatar {
    --audio-level: 0;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    position: relative;
    transform: scale(calc(1 + (var(--audio-level) * 0.055)));
    transition: transform 70ms linear, box-shadow 120ms ease;
    will-change: transform;
  }

  .avatar svg { width: 56px; height: 56px; }

  .avatar.ai {
    border-color: var(--ink);
    box-shadow:
      0 12px 40px rgba(17, 17, 17, 0.08),
      0 0 calc(10px + (var(--audio-level) * 28px))
        rgba(17, 17, 17, 0.14);
  }
  .avatar.ai svg { color: var(--ink); }

  .avatar.user {
    border-color: var(--success);
    box-shadow:
      0 12px 40px rgba(52, 101, 56, 0.12),
      0 0 calc(10px + (var(--audio-level) * 28px))
        rgba(52, 101, 56, 0.16);
  }
  .avatar.user svg { color: var(--success); }

  /* Speaking waves: two rings expanding outward from the avatar, staggered
     so a new ring launches every ~1s (2s duration, 1s delay on the 2nd). */
  .avatar::before,
  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--wave-color, var(--ink));
    opacity: 0;
    pointer-events: none;
  }
  .avatar.speaking::before,
  .avatar.speaking::after {
    animation: wave-ring 2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
  }
  .avatar.speaking::after { animation-delay: 1s; }
  .avatar.ai { --wave-color: var(--ink); }
  .avatar.user { --wave-color: var(--success); }

  @keyframes wave-ring {
    0% { transform: scale(1); opacity: 0.55; }
    100% { transform: scale(1.35); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .status-dot,
    .avatar.speaking::before,
    .avatar.speaking::after {
      animation: none;
    }
    .avatar { transition: none; }
    .avatar.speaking { outline: 3px solid var(--wave-color, var(--ink)); }
  }

  .participant-info {
    text-align: center;
  }

  .participant-name {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
    font-family: var(--font-sans);
    margin: 0;
  }

  .participant-status {
    font-size: 12px;
    color: var(--ink-3);
    margin-top: 0.25rem;
  }

  .controls {
    position: fixed;
    bottom: 6.5rem;
    left: 0;
    right: 300px;
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
    z-index: 10;
  }

  @media (max-width: 900px) {
    .controls { right: 0; }
    .question-bar { right: 0; }
  }

  .call-btn {
    padding: 0.75rem 1.5rem;
    font-size: 14px;
    min-height: 44px;
    align-items: center;
    gap: 0.4rem;
  }
  .call-btn i { font-size: 1rem; }

  .btn-record {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
  }
  .btn-record:hover:not(:disabled) {
    background: #2c5730;
    border-color: #2c5730;
  }
  .btn-record.recording {
    background: var(--danger);
    border-color: var(--danger);
  }
  .btn-record.recording:hover:not(:disabled) {
    background: #872725;
    border-color: #872725;
  }

  .btn-record[aria-pressed="true"] {
    background: var(--danger);
    border-color: var(--danger);
  }

  .control-timer {
    min-width: 5.5rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius-md);
    font: 500 13px/1 var(--font-mono);
    font-variant-numeric: tabular-nums;
  }

  #transcriptPanel[hidden],
  [hidden] {
    display: none !important;
  }

  .question-bar {
    position: fixed;
    bottom: 1.5rem;
    left: 0;
    right: 300px;
    margin: 0 auto;
    background: var(--surface);
    backdrop-filter: blur(10px);
    border: 1px solid var(--surface-border);
    padding: 1rem 1.5rem;
    border-radius: var(--radius-lg);
    max-width: 640px;
    text-align: center;
    font-size: 13px;
    font-family: var(--font-sans);
    color: var(--ink-2);
    line-height: 1.5;
  }

  @media (max-width: 768px) {
    .avatar-container {
      gap: 2rem;
      max-width: 100%;
    }

    .avatar {
      width: 110px;
      height: 110px;
    }
    .avatar svg { width: 42px; height: 42px; }

    .participant-name {
      font-size: 14px;
    }

    .question-bar {
      font-size: 12px;
      padding: 0.75rem 1rem;
    }
  }
</style>
</head>
<body>

<main>
  <div class="interview-header">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M4 19 L20 5"/><path d="M10 19 L20 9"/><path d="M4 13 L14 3"/></svg></span>
    <span class="status-dot"></span>
    <span id="interviewState" role="status" aria-live="polite">Connecting</span>
  </div>

  <div class="avatar-container">
    <!-- AI Interviewer -->
    <div class="participant">
      <div class="avatar ai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/><circle cx="9" cy="13" r="1.2" fill="currentColor" stroke="none"/><circle cx="15" cy="13" r="1.2" fill="currentColor" stroke="none"/><path d="M9 16.5c1 .6 5 .6 6 0"/></svg>
      </div>
      <div class="participant-info">
        <p class="participant-name">Interviewer</p>
        <p class="participant-status" id="aiStatus">Listening</p>
      </div>
    </div>

    <!-- You (Candidate) -->
    <div class="participant">
      <div class="avatar user">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5"/></svg>
      </div>
      <div class="participant-info">
        <p class="participant-name">You</p>
        <p class="participant-status" id="userStatus">Mic on</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="micBtn" class="btn-record call-btn" type="button" aria-pressed="false"><i class="ph-bold ph-microphone" aria-hidden="true"></i><span>Tap to speak</span></button>
    <button id="captionsBtn" class="call-btn btn-secondary" type="button" aria-pressed="true" hidden><i class="ph-bold ph-closed-captioning" aria-hidden="true"></i><span>Captions on</span></button>
    <span id="elapsedTimer" class="control-timer" aria-label="Elapsed interview time" hidden>00:00</span>
    <button class="call-btn btn-danger" id="endBtn"><i class="ph-bold ph-phone-disconnect" aria-hidden="true"></i>End interview</button>
    <button id="replayBtn" class="call-btn btn-secondary" style="display:none;"><i class="ph-bold ph-speaker-high" aria-hidden="true"></i>Tap to hear question</button>
  </div>

  <div class="question-bar" id="questionBar" role="status" aria-live="polite" style="display:none;">
    Loading interview question...
  </div>
</main>

<div id="transcriptPanel" role="log" aria-live="polite" aria-label="Interview transcript" style="position:fixed; top:0; right:0; width:300px; height:100vh; background:var(--surface); border-left:1px solid var(--surface-border); padding:1.25rem 1rem; overflow-y:auto; scroll-behavior:smooth; box-sizing:border-box; z-index:20; font-family:var(--font-sans);">
  <h3 style="color:var(--ink); font-family:var(--font-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:500; margin:0 0 1rem 0;"><i class="ph-bold ph-chats-circle" style="margin-right:0.35rem;"></i>Transcript</h3>
  <div id="transcriptLog"></div>
</div>

<div id="startOverlay" style="position:fixed; inset:0; background:var(--canvas); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.5rem; z-index:100;">
  <div class="result-icon" style="width:64px; height:64px; font-size:1.7rem;"><i class="ph-bold ph-microphone" aria-hidden="true"></i></div>
  <div style="color:var(--ink-2); font-family:var(--font-sans); font-size:15px; text-align:center; max-width:400px; padding:0 1rem;">
    Start your 10–15 minute interview. Keep speaking naturally; the interviewer will listen continuously and you can interrupt at any time.
  </div>
  <button id="startBtn" class="btn-primary call-btn"><i class="ph-bold ph-play" aria-hidden="true"></i>Start Interview</button>
</div>

<script>
  // Configuration for different environments
  (function() {
    const hostname = window.location.hostname;
    if (hostname.includes('openhire-public.vercel.app')) {
      window.OPENHIRE_API_URL = 'https://openhire.devsidd.tech';
      window.OPENHIRE_API_HOST = 'openhire.devsidd.tech';
    } else {
      window.OPENHIRE_API_URL = '';
      window.OPENHIRE_API_HOST = location.host;
    }
    console.log('[config] Environment:', hostname, 'API:', window.OPENHIRE_API_URL || 'same-origin');
  })();
</script>
<script src="js/app.js?v=local-live-demo"></script>
<script type="module" src="js/live-interview.js?v=gemini-live-v6"></script>

</body>
</html>
