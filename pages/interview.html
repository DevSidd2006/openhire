<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  /* Google Meet Minimal Dark Canvas */
  body {
    background: #0d0f14;
    overflow-x: hidden;
  }
  
  .meet-container {
    max-width: 1200px;
    margin: 1.2rem auto;
    padding: 0 1.25rem 5rem;
  }

  .meet-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
    padding: 0.5rem 0;
  }

  .meet-title-group {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .rec-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.25);
    color: #f87171;
    padding: 0.25rem 0.65rem;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
  }

  .rec-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--danger);
    animation: pulse 1.2s infinite;
  }

  /* 50/50 Video Grid */
  .meet-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
    min-height: 480px;
  }

  @media (max-width: 860px) {
    .meet-grid {
      grid-template-columns: 1fr;
      min-height: auto;
    }
  }

  /* Video Tiles */
  .meet-tile {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    min-height: 380px;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .meet-tile.speaking {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px var(--primary), 0 8px 32px rgba(59, 130, 246, 0.25);
  }

  .meet-tile.user-speaking {
    border-color: var(--success);
    box-shadow: 0 0 0 2px var(--success), 0 8px 32px rgba(16, 185, 129, 0.25);
  }

  .tile-tag {
    position: absolute;
    bottom: 1rem;
    left: 1rem;
    background: rgba(15, 18, 26, 0.8);
    backdrop-filter: blur(8px);
    border: 1px solid var(--surface-border);
    padding: 0.35rem 0.75rem;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-main);
    z-index: 10;
  }

  .tile-top-status {
    position: absolute;
    top: 1rem;
    right: 1rem;
    background: rgba(15, 18, 26, 0.75);
    backdrop-filter: blur(8px);
    border: 1px solid var(--surface-border);
    padding: 0.25rem 0.6rem;
    border-radius: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-muted);
    z-index: 10;
  }

  /* AI Glowing Orb Effect */
  .ai-orb-wrap {
    position: relative;
    width: 140px;
    height: 140px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ai-orb {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #3b82f6, #6366f1, #06b6d4);
    box-shadow: 0 0 30px rgba(59, 130, 246, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    color: #fff;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 2;
  }

  .ai-aura {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px solid rgba(59, 130, 246, 0.4);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .meet-tile.speaking .ai-orb {
    transform: scale(1.08);
    animation: orbPulse 1.2s infinite alternate;
  }

  .meet-tile.speaking .ai-aura {
    opacity: 1;
    animation: auraRipple 1.6s infinite;
  }

  @keyframes orbPulse {
    0% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    100% { box-shadow: 0 0 55px rgba(99, 102, 241, 0.8), 0 0 20px rgba(6, 182, 212, 0.6); }
  }

  @keyframes auraRipple {
    0% { transform: scale(0.9); opacity: 0.8; }
    100% { transform: scale(1.4); opacity: 0; }
  }

  /* Candidate Tile / Video Canvas */
  #userVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .user-avatar-fallback {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #1e2433;
    border: 2px solid var(--surface-border-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 700;
    color: var(--text-muted);
  }

  /* Question Overlay Subtitle Bar */
  .question-subtitle-bar {
    background: rgba(17, 20, 28, 0.95);
    border: 1px solid var(--surface-border);
    backdrop-filter: blur(16px);
    border-radius: 12px;
    padding: 1.1rem 1.5rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  }

  .q-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
    background: var(--primary-subtle);
    border: 1px solid rgba(59, 130, 246, 0.25);
    padding: 0.25rem 0.55rem;
    border-radius: 4px;
    white-space: nowrap;
  }

  .q-live-text {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text-main);
    line-height: 1.4;
    flex: 1;
  }

  /* Meet Bottom Control Dock */
  .meet-dock {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    background: rgba(17, 20, 28, 0.9);
    backdrop-filter: blur(20px);
    border: 1px solid var(--surface-border);
    padding: 0.75rem 1.5rem;
    border-radius: 40px;
    max-width: 620px;
    margin: 0 auto 1.5rem;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  }

  .dock-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: #1c2230;
    border: 1px solid var(--surface-border);
    color: var(--text-main);
    cursor: pointer;
    transition: all 0.15s ease;
    padding: 0;
  }

  .dock-btn:hover:not(:disabled) {
    background: #273044;
    border-color: var(--surface-border-light);
    transform: translateY(-2px);
  }

  .dock-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
  }

  .dock-btn.speaking {
    background: var(--danger) !important;
    border-color: var(--danger) !important;
    color: #fff !important;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    animation: livePulse 1.2s infinite;
  }

  .dock-btn.btn-end {
    background: rgba(239, 68, 68, 0.2);
    border-color: rgba(239, 68, 68, 0.3);
    color: #f87171;
    width: auto;
    padding: 0 1.25rem;
    border-radius: 24px;
    font-size: 12.5px;
    font-weight: 600;
  }
  .dock-btn.btn-end:hover {
    background: var(--danger);
    color: #fff;
  }

  /* Compact Transcript Drawer */
  .meet-transcript-panel {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
  }
</style>
</head>
<body>
<div id="navbarContainer"></div>

<main class="meet-container">
  
  <div class="meet-topbar">
    <div class="meet-title-group">
      <div class="rec-badge"><span class="rec-dot"></span> LIVE AI SESSION</div>
      <div style="font-family:var(--font-mono); font-size:12px; color:var(--text-muted);" id="sessionMetaText">SESSION: —</div>
    </div>
    <div style="display:flex; align-items:center; gap:0.6rem;">
      <span class="tag" id="statusBadge">Ready</span>
      <button class="btn-outline" style="padding:0.3rem 0.75rem; font-size:12px;" onclick="toggleTranscript()">Toggle Transcript</button>
    </div>
  </div>

  <!-- Question Subtitle Overlay -->
  <div class="question-subtitle-bar">
    <span class="q-badge" id="qCounter">Q1 OF 3</span>
    <div class="q-live-text" id="currentQText">Loading interview question...</div>
    <button class="btn-outline" style="padding:0.35rem 0.75rem; font-size:12px;" onclick="repeatQuestion()">🔊 Replay</button>
  </div>

  <!-- Google Meet 50/50 Stage Grid -->
  <div class="meet-grid">
    
    <!-- AI Stage (Left 50%) -->
    <div class="meet-tile" id="aiTile">
      <div class="tile-top-status">
        <span id="aiSpeechState">Listening</span>
      </div>

      <div class="ai-orb-wrap">
        <div class="ai-aura"></div>
        <div class="ai-orb" id="aiOrbIcon">🤖</div>
      </div>

      <div style="display:flex; justify-content:center; gap:0.75rem; align-items:center; flex-wrap:wrap;">
        <button class="mic-button" id="btnMic" disabled
                onmousedown="startSpeech()" onmouseup="stopSpeech()" onmouseleave="stopSpeech()"
                ontouchstart="startSpeech()" ontouchend="stopSpeech()">
          🎙️ Hold to Speak Answer
        </button>
        <button class="btn-secondary" onclick="repeatQuestion()">
          🔊 Replay
        </button>
      </div>

      <div class="tile-tag">
        <span class="dot on"></span> AI Evaluator (Adaptive)
      </div>
    </div>

    <!-- Candidate Stage (Right 50%) -->
    <div class="meet-tile" id="userTile">
      <div class="tile-top-status">
        <span id="userMicStatus">Mic Ready</span>
      </div>

      <!-- Live Video stream or styled monogram avatar -->
      <video id="userVideo" autoplay playsinline muted style="display:none;"></video>
      <div class="user-avatar-fallback" id="userFallbackAvatar">AM</div>

      <div style="margin-top: 1.25rem; text-align:center;" id="userMetaWrap">
        <h3 style="font-weight:600; font-size:1.05rem; margin-bottom:0.25rem;" id="candidateDisplayName">Alex Morgan (You)</h3>
        <div class="wave-bars" id="userWave" style="display:none; margin:0 auto;">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="tile-tag">
        <span class="dot on"></span> <span id="candidateTagText">Alex Morgan (Candidate)</span>
      </div>
    </div>

  </div>

  <!-- Meet Bottom Action Dock -->
  <div class="meet-dock">
    <button class="dock-btn" id="btnMicHold" title="Hold or Click to Speak"
            onmousedown="startSpeech()" onmouseup="stopSpeech()"
            ontouchstart="startSpeech()" ontouchend="stopSpeech()">
      🎤
    </button>
    <button class="dock-btn" id="btnCamToggle" title="Toggle Camera" onclick="toggleCamera()">
      📹
    </button>
    <button class="dock-btn" title="Replay AI Speech" onclick="repeatQuestion()">
      🔊
    </button>
    <button class="dock-btn btn-end" onclick="finishSession()">
      End Call & Score →
    </button>
  </div>

  <!-- Type Answer Fallback -->
  <div style="max-width: 540px; margin: 0 auto 1.5rem; display:flex; gap:0.5rem;">
    <input type="text" id="typeInput" class="form-control" placeholder="Type text response if microphone is unavailable...">
    <button class="btn-secondary" onclick="submitText()">Send</button>
  </div>

  <!-- Sealed Transcript Container -->
  <div class="meet-transcript-panel" id="transcriptContainer">
    <div class="card-header" style="margin-bottom:0.5rem;">
      <span style="font-size:11px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted);">Real-Time Sealed Transcript</span>
      <span class="tag">Audited</span>
    </div>
    <div class="transcript-area" id="transcriptLog" style="max-height: 160px;">
      <div class="log-line"><span class="speaker-tag" style="color:var(--text-faint);">[SYS]</span> Connected to multi-agent interview evaluator. Audio stream active.</div>
    </div>
  </div>

</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('session_id');
  const appId = urlParams.get('app_id') || '';

  document.getElementById('sessionMetaText').textContent = `SESSION: ${sessionId || '—'}`;

  let currentQuestion = null;
  let maxQuestions = 0;
  let ended = false;

  function setStatus(text) {
    document.getElementById('statusBadge').textContent = `Status: ${text}`;
  }

  function showQuestion(question, questionsAsked) {
    if (!question) return;
    // Both transports can report the SAME current question (a REST GET on
    // load, then a WS "speak_question" reply) - only log it once.
    const isSameQuestion = currentQuestion && currentQuestion.question_id === question.question_id;
    currentQuestion = question;
    document.getElementById('qCounter').textContent =
      `QUESTION ${questionsAsked}${maxQuestions ? ' OF ' + maxQuestions : ''} • ADAPTIVE PROBE`;
    document.getElementById('currentQText').textContent = question.question_text;
    if (!isSameQuestion) {
      addLog('Interviewer', question.question_text);
    }
  }

  function endInterview(terminationReason) {
    ended = true;
    document.getElementById('currentQText').textContent =
      'Interview completed. Finalizing multi-agent evaluation...';
    setStatus('Evaluating');
    document.getElementById('typeInput').disabled = true;
    document.getElementById('btnMic').disabled = true;
    if (voice.ws) {
      voice.ws.close();
    }
    addLog('System', `Interview sealed${terminationReason ? ' (' + terminationReason + ')' : ''}. Transcript is now immutable.`);
    setTimeout(() => {
      window.location.href = `report.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(appId)}`;
    }, 1500);
  }

  async function loadSession() {
    if (!sessionId) {
      document.getElementById('currentQText').textContent = 'No interview session specified.';
      setStatus('Error');
      return;
    }
    try {
      const state = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}`);
      maxQuestions = state.progress ? state.progress.max_questions : 0;
      if (state.status === 'sealed' || state.status === 'failed') {
        endInterview(state.termination_reason);
        return;
      }
      showQuestion(state.current_question, state.progress ? state.progress.questions_asked : 0);
      setStatus('Ready');
      voice.connect();
    } catch (err) {
      document.getElementById('currentQText').textContent = `Could not load this interview: ${err.message}`;
      setStatus('Error');
    }
  }

  async function refreshProgressAfter(nextQuestion) {
    // Re-read the session for the authoritative questions_asked counter
    // rather than tracking it by hand on the client - shared by the text
    // and voice answer paths so the counter logic lives in one place.
    const state = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}`);
    showQuestion(nextQuestion, state.progress ? state.progress.questions_asked : 0);
  }

  // ---------------------------------------------------------------------
  // Voice: reuses the EXISTING WebSocket interview transport
  // (api/routes/voice.py, WS /ws/sessions/{id}) and the EXISTING push-to-
  // talk audio capture/encoding from pages/voice-interview.html - not a
  // second implementation. That endpoint drives the SAME
  // InterviewService/InterviewSessionRunner the text answers above call,
  // so there is exactly one interview engine, one transcript, one
  // evaluation regardless of which transport answered a given question.
  // ---------------------------------------------------------------------
  const voice = (() => {
    const TARGET_RATE = 16000;
    let ws = null, stream = null, audioCtx = null, node = null, source = null;
    let pcmChunks = [], capturing = false, sourceRate = 48000;

    function downsampleTo16k(input, inputRate) {
      if (inputRate === TARGET_RATE) return input;
      const ratio = inputRate / TARGET_RATE;
      const outLength = Math.floor(input.length / ratio);
      const out = new Float32Array(outLength);
      for (let i = 0; i < outLength; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), input.length);
        let sum = 0, n = 0;
        for (let j = start; j < end; j++) { sum += input[j]; n++; }
        out[i] = n ? sum / n : 0;
      }
      return out;
    }

    function encodeWav(float32, sampleRate) {
      const bytesPerSample = 2;
      const dataSize = float32.length * bytesPerSample;
      const buf = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buf);
      const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      w(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      w(8, 'WAVE');
      w(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);
      w(36, 'data');
      view.setUint32(40, dataSize, true);
      let off = 44;
      for (let i = 0; i < float32.length; i++, off += 2) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buf;
    }

    function b64(buf) {
      let s = '', bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    function play(b64audio, format) {
      if (!b64audio) return;
      const bin = atob(b64audio);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: format === 'mp3' ? 'audio/mpeg' : 'audio/wav' });
      new Audio(URL.createObjectURL(blob)).play().catch(() => {
        addLog('System', '(browser blocked autoplay for the question audio — click anywhere on the page, then Replay)');
      });
    }

    function connect() {
      if (!sessionId || ended) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${encodeURIComponent(sessionId)}`);

      ws.onopen = () => {
        document.getElementById('btnMic').disabled = false;
        ws.send(JSON.stringify({ type: 'speak_question' }));
      };
      ws.onclose = () => {
        document.getElementById('btnMic').disabled = true;
      };
      ws.onerror = () => {
        document.getElementById('btnMic').disabled = true;
        if (!ended) {
          addLog('System', 'Voice connection unavailable — you can still type your answers below.');
        }
      };
      ws.onmessage = async (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          addLog('System', 'Received a malformed message from the voice channel — ignoring it.');
          return;
        }
        if (msg.type === 'error') {
          addLog('System', `Voice error: ${msg.error}${msg.detail ? ' — ' + msg.detail : ''}`);
          setStatus('Ready');
          return;
        }
        if (msg.outcome === 'no_speech_detected') {
          addLog('System', '(no speech detected — please try answering again)');
          setStatus('Ready');
          return;
        }
        if (msg.transcript) {
          addLog('Candidate', msg.transcript);
        }
        if (msg.tts_error) {
          addLog('System', '(question audio unavailable — showing text only)');
        }
        if (msg.status === 'sealed') {
          endInterview(msg.termination_reason);
        } else if (msg.next_question) {
          await refreshProgressAfter(msg.next_question);
          setStatus('Ready');
        }
        play(msg.question_audio_base64, msg.audio_format);
      };
    }

    async function startRecording() {
      if (!ws || ws.readyState !== WebSocket.OPEN || capturing || ended) return;
      try {
        stream = stream || await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        addLog('System', 'Microphone permission denied — please type your answer below.');
        return;
      }

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      sourceRate = audioCtx.sampleRate;

      pcmChunks = [];
      capturing = true;
      source = audioCtx.createMediaStreamSource(stream);
      node = audioCtx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (e) => {
        if (!capturing) return;
        pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      };
      source.connect(node);
      const mute = audioCtx.createGain();
      mute.gain.value = 0;
      node.connect(mute);
      mute.connect(audioCtx.destination);

      const btn = document.getElementById('btnMic');
      btn.classList.add('recording');
      btn.innerHTML = '🔴 Recording... (Release to Send)';
      setStatus('Recording Audio');
    }

    function stopRecording() {
      const btn = document.getElementById('btnMic');
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️ Hold to Speak Answer';
      if (!capturing) return;
      capturing = false;
      try { source && source.disconnect(); node && node.disconnect(); } catch (e) {}

      const total = pcmChunks.reduce((n, c) => n + c.length, 0);
      if (!total) { setStatus('Ready'); return; }
      const merged = new Float32Array(total);
      let off = 0;
      for (const c of pcmChunks) { merged.set(c, off); off += c.length; }

      const wav = encodeWav(downsampleTo16k(merged, sourceRate), TARGET_RATE);
      addLog('System', '(processing your answer…)');
      setStatus('Evaluating Response');
      ws.send(JSON.stringify({
        type: 'answer',
        audio_base64: b64(wav),
        audio_format: 'wav',
        utterance_id: crypto.randomUUID(),
      }));
    }

    function replay() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'speak_question' }));
        return true;
      }
      return false;
    }

    return { connect, startRecording, stopRecording, replay, get ws() { return ws; } };
  })();

  function startSpeech() {
    voice.startRecording();
  }

  function stopSpeech() {
    voice.stopRecording();
  }

  async function submitAnswer(answerText) {
    if (ended || !sessionId) return;
    addLog('Candidate', answerText);
    setStatus('Evaluating Response');
    try {
      const result = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}/answers`, {
        method: 'POST',
        body: { answer_text: answerText },
      });
      if (result.status === 'sealed' || result.status === 'failed') {
        endInterview(result.termination_reason);
        return;
      }
      await refreshProgressAfter(result.next_question);
      setStatus('Ready');
    } catch (err) {
      addLog('System', `Could not submit that answer: ${err.message}`);
      setStatus('Ready');
    }
  }

  function submitText() {
    const input = document.getElementById('typeInput');
    const val = input.value.trim();
    if (!val) return;
    input.value = '';
    submitAnswer(val);
  }

  function repeatQuestion() {
    if (voice.replay()) return;
    alert(`Interviewer: "${currentQuestion ? currentQuestion.question_text : 'Completed.'}"`);
  }

  function addLog(speaker, text) {
    const log = document.getElementById('transcriptLog');
    const line = document.createElement('div');
    line.className = 'log-line';
    const isAi = speaker === 'Interviewer';

    const tag = document.createElement('span');
    tag.className = `speaker-tag ${isAi ? 'ai' : 'cand'}`;
    tag.textContent = `[${speaker.toUpperCase()}]`;

    line.appendChild(tag);
    line.appendChild(document.createTextNode(` ${text}`));

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  async function finishSession() {
    if (!sessionId || ended) return;
    try {
      const result = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}/finish`, { method: 'POST' });
      endInterview(result.termination_reason || 'manual_finish');
    } catch (err) {
      alert(`Could not finish the interview: ${err.message}`);
    }
  }

  loadSession();
</script>
</body>
</html>
