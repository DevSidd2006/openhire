<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Live AI Interview</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .voice-box {
    text-align: center;
    padding: 3rem 1.5rem;
    background: #0b0d13;
    border-radius: var(--radius-md);
    border: 1px dashed var(--surface-border);
    margin: 1.5rem 0;
  }
  .voice-status-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--text-dim);
    margin-right: 0.5rem;
  }
  .voice-status-dot.active { background: var(--success); box-shadow: 0 0 10px var(--success); }
  .voice-status-dot.recording { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
</style>
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div style="max-width: 760px; margin: 0 auto;">
    <div class="card-header">
      <div>
        <h2 class="card-title">Adaptive AI Voice Interview</h2>
        <p class="card-sub" id="interviewMeta">Session ID: —</p>
      </div>
      <button class="btn-danger" onclick="endInterview()">End Interview</button>
    </div>

    <div class="card">
      <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:0.5rem;">
        Current Question (Adaptive Interviewer)
      </div>
      <div id="interviewQuestionText" style="font-size:1.15rem; font-weight:600; color:var(--text-main); min-height:60px;">
        Loading question...
      </div>
    </div>

    <div class="voice-box">
      <div style="margin-bottom:1.25rem;">
        <span class="voice-status-dot" id="voiceStatusDot"></span>
        <span id="voiceStatusLabel" style="font-size:0.9rem; color:var(--text-muted);">Idle</span>
      </div>
      
      <div style="display:flex; justify-content:center; gap:1rem; flex-wrap:wrap;">
        <button class="btn-primary" id="btnVoiceTalk" style="font-size:1.1rem; padding:0.85rem 1.75rem;" onmousedown="startVoiceAnswer()" onmouseup="stopVoiceAnswer()" ontouchstart="startVoiceAnswer()" ontouchend="stopVoiceAnswer()">
          🎤 Hold to Speak Answer
        </button>
        <button class="btn-secondary" onclick="repeatQuestion()">🔊 Repeat</button>
      </div>
      <p style="font-size:0.8rem; color:var(--text-dim); margin-top:1rem;">Or type your answer below if microphone is unavailable:</p>
      
      <div style="max-width:540px; margin:1rem auto 0; display:flex; gap:0.5rem;">
        <input type="text" id="textAnswerInput" class="form-control" placeholder="Type answer...">
        <button class="btn-secondary" onclick="submitTextAnswer()">Submit</button>
      </div>
    </div>

    <div class="card">
      <div style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-muted); margin-bottom:0.5rem;">
        Live Immutable Transcript
      </div>
      <div id="transcriptLog" style="max-height: 220px; overflow-y:auto; font-size:0.85rem; font-family:var(--font-mono); color:var(--text-muted);">
        <div>[System] Session active. Connected to Adaptive Interview Engine.</div>
      </div>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('session_id') || ('sess-' + Date.now());
  const appId = urlParams.get('app_id') || 'app-01';

  document.getElementById('interviewMeta').textContent = `Session: ${sessionId}`;

  const questions = [
    "Could you describe your architectural approach to designing high-concurrency microservices?",
    "How do you handle zero-downtime database schema migrations in production?",
    "Tell me about a challenging technical trade-off you had to negotiate with stakeholders."
  ];
  let currentIdx = 0;

  function loadQuestion() {
    if (currentIdx < questions.length) {
      document.getElementById('interviewQuestionText').textContent = questions[currentIdx];
      logMessage('Interviewer', questions[currentIdx]);
    } else {
      document.getElementById('interviewQuestionText').textContent = "Interview completed! Sealing transcript and running multi-agent scoring...";
      setTimeout(endInterview, 1500);
    }
  }

  function startVoiceAnswer() {
    document.getElementById('voiceStatusDot').className = 'voice-status-dot recording';
    document.getElementById('voiceStatusLabel').textContent = 'Listening to audio...';
  }

  function stopVoiceAnswer() {
    document.getElementById('voiceStatusDot').className = 'voice-status-dot active';
    document.getElementById('voiceStatusLabel').textContent = 'Processing with Adaptive Engine...';

    setTimeout(() => {
      logMessage('Candidate', 'Spoken audio response captured and transcribed.');
      currentIdx++;
      loadQuestion();
      document.getElementById('voiceStatusDot').className = 'voice-status-dot';
      document.getElementById('voiceStatusLabel').textContent = 'Idle';
    }, 1200);
  }

  function submitTextAnswer() {
    const input = document.getElementById('textAnswerInput');
    if (!input.value.trim()) return;
    logMessage('Candidate', input.value.trim());
    input.value = '';
    currentIdx++;
    loadQuestion();
  }

  function repeatQuestion() {
    alert(`Interviewer: "${questions[currentIdx] || 'Session finished.'}"`);
  }

  function logMessage(sender, text) {
    const logEl = document.getElementById('transcriptLog');
    const div = document.createElement('div');
    div.innerHTML = `<span style="color:var(--primary); font-weight:600;">${sender}:</span> ${text}`;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function endInterview() {
    alert('Interview transcript sealed! Running 7-agent evaluation pipeline.');
    window.location.href = `report.html?app_id=${encodeURIComponent(appId)}`;
  }

  loadQuestion();
</script>
</body>
</html>
