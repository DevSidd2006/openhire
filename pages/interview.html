<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .interview-box {
    max-width: 740px;
    margin: 1.5rem auto;
  }
  .session-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.9rem;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    margin-bottom: 1.25rem;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  .status-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--success);
    margin-right: 6px;
  }
  .question-panel {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.25rem;
  }
  .question-counter {
    font-family: var(--font-mono);
    font-size: 11px;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 0.5rem;
  }
  .question-text {
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.4;
    color: var(--text-main);
  }
  .audio-stage {
    text-align: center;
    padding: 2.25rem 1.5rem;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    margin-bottom: 1.25rem;
  }
  .mic-button {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    padding: 0.85rem 2rem;
    border-radius: var(--radius);
    background: var(--primary);
    color: #fff;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .mic-button:hover { background: var(--primary-hover); }
  .mic-button.recording {
    background: var(--danger);
    animation: livePulse 1.2s infinite;
  }
  @keyframes livePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
  .transcript-area {
    background: var(--bg);
    border: 1px solid var(--surface-border);
    border-radius: var(--radius);
    padding: 0.9rem;
    max-height: 180px;
    overflow-y: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
  }
  .log-line { padding: 0.25rem 0; }
  .speaker-tag { font-weight: 600; }
  .speaker-tag.ai { color: var(--primary); }
  .speaker-tag.cand { color: var(--success); }
</style>
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="interview-box">
    
    <div class="session-header">
      <div>
        <span class="status-dot"></span>
        <span style="color:var(--text-main);">LIVE EVALUATION</span>
      </div>
      <div id="sessionMetaText">SESSION: —</div>
    </div>

    <!-- Question View -->
    <div class="question-panel">
      <div class="question-counter" id="qCounter">QUESTION 1 OF 3 • ADAPTIVE PROBE</div>
      <div class="question-text" id="currentQText">Loading prompt...</div>
    </div>

    <!-- Audio Interaction -->
    <div class="audio-stage">
      <div style="margin-bottom: 1.25rem;">
        <span class="tag" id="statusBadge">Status: Ready</span>
      </div>

      <div style="display:flex; justify-content:center; gap:0.75rem; align-items:center; flex-wrap:wrap;">
        <button class="mic-button" id="btnMic" disabled
                onmousedown="startSpeech()" onmouseup="stopSpeech()" onmouseleave="stopSpeech()"
                ontouchstart="startSpeech()" ontouchend="stopSpeech()">
          🎙️ Hold to Speak Answer
        </button>
        <button class="btn-secondary" onclick="repeatQuestion()">
          🔊 Replay
        </button>
      </div>

      <div style="max-width: 480px; margin: 1.25rem auto 0; display:flex; gap: 0.5rem;">
        <input type="text" id="typeInput" class="form-control" placeholder="Or type your response...">
        <button class="btn-secondary" onclick="submitText()">Send</button>
      </div>
    </div>

    <!-- Immutable Transcript -->
    <div class="card">
      <div class="card-header" style="margin-bottom:0.75rem;">
        <span style="font-size:12px; font-family:var(--font-mono); text-transform:uppercase; color:var(--text-muted);">Immutable Transcript</span>
        <button class="btn-danger" style="padding:0.3rem 0.7rem; font-size:11.5px;" onclick="finishSession()">Complete Interview</button>
      </div>
      <div class="transcript-area" id="transcriptLog">
        <div class="log-line"><span class="speaker-tag" style="color:var(--text-faint);">[SYS]</span> Adaptive session started. Transcript sealed upon finish.</div>
      </div>
    </div>

  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const sessionId = urlParams.get('session_id');
  const appId = urlParams.get('app_id') || '';

  document.getElementById('sessionMetaText').textContent = `SESSION: ${sessionId || '—'}`;

  let currentQuestion = null;
  let maxQuestions = 0;
  let ended = false;

  function setStatus(text) {
    document.getElementById('statusBadge').textContent = `Status: ${text}`;
  }

  function showQuestion(question, questionsAsked) {
    if (!question) return;
    // Both transports can report the SAME current question (a REST GET on
    // load, then a WS "speak_question" reply) - only log it once.
    const isSameQuestion = currentQuestion && currentQuestion.question_id === question.question_id;
    currentQuestion = question;
    document.getElementById('qCounter').textContent =
      `QUESTION ${questionsAsked}${maxQuestions ? ' OF ' + maxQuestions : ''} • ADAPTIVE PROBE`;
    document.getElementById('currentQText').textContent = question.question_text;
    if (!isSameQuestion) {
      addLog('Interviewer', question.question_text);
    }
  }

  function endInterview(terminationReason) {
    ended = true;
    document.getElementById('currentQText').textContent =
      'Interview completed. Finalizing multi-agent evaluation...';
    setStatus('Evaluating');
    document.getElementById('typeInput').disabled = true;
    document.getElementById('btnMic').disabled = true;
    if (voice.ws) {
      voice.ws.close();
    }
    addLog('System', `Interview sealed${terminationReason ? ' (' + terminationReason + ')' : ''}. Transcript is now immutable.`);
    setTimeout(() => {
      window.location.href = `report.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(appId)}`;
    }, 1500);
  }

  async function loadSession() {
    if (!sessionId) {
      document.getElementById('currentQText').textContent = 'No interview session specified.';
      setStatus('Error');
      return;
    }
    try {
      const state = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}`);
      maxQuestions = state.progress ? state.progress.max_questions : 0;
      if (state.status === 'sealed' || state.status === 'failed') {
        endInterview(state.termination_reason);
        return;
      }
      showQuestion(state.current_question, state.progress ? state.progress.questions_asked : 0);
      setStatus('Ready');
      voice.connect();
    } catch (err) {
      document.getElementById('currentQText').textContent = `Could not load this interview: ${err.message}`;
      setStatus('Error');
    }
  }

  async function refreshProgressAfter(nextQuestion) {
    // Re-read the session for the authoritative questions_asked counter
    // rather than tracking it by hand on the client - shared by the text
    // and voice answer paths so the counter logic lives in one place.
    const state = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}`);
    showQuestion(nextQuestion, state.progress ? state.progress.questions_asked : 0);
  }

  // ---------------------------------------------------------------------
  // Voice: reuses the EXISTING WebSocket interview transport
  // (api/routes/voice.py, WS /ws/sessions/{id}) and the EXISTING push-to-
  // talk audio capture/encoding from pages/voice-interview.html - not a
  // second implementation. That endpoint drives the SAME
  // InterviewService/InterviewSessionRunner the text answers above call,
  // so there is exactly one interview engine, one transcript, one
  // evaluation regardless of which transport answered a given question.
  // ---------------------------------------------------------------------
  const voice = (() => {
    const TARGET_RATE = 16000;
    let ws = null, stream = null, audioCtx = null, node = null, source = null;
    let pcmChunks = [], capturing = false, sourceRate = 48000;

    function downsampleTo16k(input, inputRate) {
      if (inputRate === TARGET_RATE) return input;
      const ratio = inputRate / TARGET_RATE;
      const outLength = Math.floor(input.length / ratio);
      const out = new Float32Array(outLength);
      for (let i = 0; i < outLength; i++) {
        const start = Math.floor(i * ratio);
        const end = Math.min(Math.floor((i + 1) * ratio), input.length);
        let sum = 0, n = 0;
        for (let j = start; j < end; j++) { sum += input[j]; n++; }
        out[i] = n ? sum / n : 0;
      }
      return out;
    }

    function encodeWav(float32, sampleRate) {
      const bytesPerSample = 2;
      const dataSize = float32.length * bytesPerSample;
      const buf = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buf);
      const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      w(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      w(8, 'WAVE');
      w(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * bytesPerSample, true);
      view.setUint16(32, bytesPerSample, true);
      view.setUint16(34, 16, true);
      w(36, 'data');
      view.setUint32(40, dataSize, true);
      let off = 44;
      for (let i = 0; i < float32.length; i++, off += 2) {
        const s = Math.max(-1, Math.min(1, float32[i]));
        view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return buf;
    }

    function b64(buf) {
      let s = '', bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
      return btoa(s);
    }

    function play(b64audio, format) {
      if (!b64audio) return;
      const bin = atob(b64audio);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      const blob = new Blob([arr], { type: format === 'mp3' ? 'audio/mpeg' : 'audio/wav' });
      new Audio(URL.createObjectURL(blob)).play().catch(() => {
        addLog('System', '(browser blocked autoplay for the question audio — click anywhere on the page, then Replay)');
      });
    }

    function connect() {
      if (!sessionId || ended) return;
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws/sessions/${encodeURIComponent(sessionId)}`);

      ws.onopen = () => {
        document.getElementById('btnMic').disabled = false;
        ws.send(JSON.stringify({ type: 'speak_question' }));
      };
      ws.onclose = () => {
        document.getElementById('btnMic').disabled = true;
      };
      ws.onerror = () => {
        document.getElementById('btnMic').disabled = true;
        if (!ended) {
          addLog('System', 'Voice connection unavailable — you can still type your answers below.');
        }
      };
      ws.onmessage = async (event) => {
        let msg;
        try {
          msg = JSON.parse(event.data);
        } catch (e) {
          addLog('System', 'Received a malformed message from the voice channel — ignoring it.');
          return;
        }
        if (msg.type === 'error') {
          addLog('System', `Voice error: ${msg.error}${msg.detail ? ' — ' + msg.detail : ''}`);
          setStatus('Ready');
          return;
        }
        if (msg.outcome === 'no_speech_detected') {
          addLog('System', '(no speech detected — please try answering again)');
          setStatus('Ready');
          return;
        }
        if (msg.transcript) {
          addLog('Candidate', msg.transcript);
        }
        if (msg.tts_error) {
          addLog('System', '(question audio unavailable — showing text only)');
        }
        if (msg.status === 'sealed') {
          endInterview(msg.termination_reason);
        } else if (msg.next_question) {
          await refreshProgressAfter(msg.next_question);
          setStatus('Ready');
        }
        play(msg.question_audio_base64, msg.audio_format);
      };
    }

    async function startRecording() {
      if (!ws || ws.readyState !== WebSocket.OPEN || capturing || ended) return;
      try {
        stream = stream || await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        addLog('System', 'Microphone permission denied — please type your answer below.');
        return;
      }

      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      sourceRate = audioCtx.sampleRate;

      pcmChunks = [];
      capturing = true;
      source = audioCtx.createMediaStreamSource(stream);
      node = audioCtx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (e) => {
        if (!capturing) return;
        pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
      };
      source.connect(node);
      const mute = audioCtx.createGain();
      mute.gain.value = 0;
      node.connect(mute);
      mute.connect(audioCtx.destination);

      const btn = document.getElementById('btnMic');
      btn.classList.add('recording');
      btn.innerHTML = '🔴 Recording... (Release to Send)';
      setStatus('Recording Audio');
    }

    function stopRecording() {
      const btn = document.getElementById('btnMic');
      btn.classList.remove('recording');
      btn.innerHTML = '🎙️ Hold to Speak Answer';
      if (!capturing) return;
      capturing = false;
      try { source && source.disconnect(); node && node.disconnect(); } catch (e) {}

      const total = pcmChunks.reduce((n, c) => n + c.length, 0);
      if (!total) { setStatus('Ready'); return; }
      const merged = new Float32Array(total);
      let off = 0;
      for (const c of pcmChunks) { merged.set(c, off); off += c.length; }

      const wav = encodeWav(downsampleTo16k(merged, sourceRate), TARGET_RATE);
      addLog('System', '(processing your answer…)');
      setStatus('Evaluating Response');
      ws.send(JSON.stringify({
        type: 'answer',
        audio_base64: b64(wav),
        audio_format: 'wav',
        utterance_id: crypto.randomUUID(),
      }));
    }

    function replay() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'speak_question' }));
        return true;
      }
      return false;
    }

    return { connect, startRecording, stopRecording, replay, get ws() { return ws; } };
  })();

  function startSpeech() {
    voice.startRecording();
  }

  function stopSpeech() {
    voice.stopRecording();
  }

  async function submitAnswer(answerText) {
    if (ended || !sessionId) return;
    addLog('Candidate', answerText);
    setStatus('Evaluating Response');
    try {
      const result = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}/answers`, {
        method: 'POST',
        body: { answer_text: answerText },
      });
      if (result.status === 'sealed' || result.status === 'failed') {
        endInterview(result.termination_reason);
        return;
      }
      await refreshProgressAfter(result.next_question);
      setStatus('Ready');
    } catch (err) {
      addLog('System', `Could not submit that answer: ${err.message}`);
      setStatus('Ready');
    }
  }

  function submitText() {
    const input = document.getElementById('typeInput');
    const val = input.value.trim();
    if (!val) return;
    input.value = '';
    submitAnswer(val);
  }

  function repeatQuestion() {
    if (voice.replay()) return;
    alert(`Interviewer: "${currentQuestion ? currentQuestion.question_text : 'Completed.'}"`);
  }

  function addLog(speaker, text) {
    const log = document.getElementById('transcriptLog');
    const line = document.createElement('div');
    line.className = 'log-line';
    const isAi = speaker === 'Interviewer';

    const tag = document.createElement('span');
    tag.className = `speaker-tag ${isAi ? 'ai' : 'cand'}`;
    tag.textContent = `[${speaker.toUpperCase()}]`;

    line.appendChild(tag);
    line.appendChild(document.createTextNode(` ${text}`));

    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  async function finishSession() {
    if (!sessionId || ended) return;
    try {
      const result = await apiRequest(`/sessions/${encodeURIComponent(sessionId)}/finish`, { method: 'POST' });
      endInterview(result.termination_reason || 'manual_finish');
    } catch (err) {
      alert(`Could not finish the interview: ${err.message}`);
    }
  }

  loadSession();
</script>
</body>
</html>
