<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Interview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body {
    background: #0a0e17;
    overflow: hidden;
    margin: 0;
    padding: 0;
    height: 100vh;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 1rem;
    position: relative;
  }

  .interview-header {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #10b981;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .avatar-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4rem;
    align-items: center;
    width: 100%;
    max-width: 900px;
    flex: 1;
    justify-content: center;
  }

  .participant {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
  }

  .activity-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    height: 8px;
  }

  .activity-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(107, 114, 128, 0.5);
    animation: none;
  }

  .activity-dot.active {
    background: #6366f1;
    animation: dot-pulse 1.2s infinite;
  }

  @keyframes dot-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .avatar {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    position: relative;
  }

  .avatar.ai {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
  }

  .avatar.user {
    background: linear-gradient(135deg, #14b8a6, #06b6d4);
  }

  .participant-info {
    text-align: center;
  }

  .participant-name {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin: 0;
  }

  .participant-status {
    font-size: 12px;
    color: #9ca3af;
    margin-top: 0.25rem;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .btn-end {
    background: #dc2626;
    color: #fff;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-end:hover {
    background: #b91c1c;
    transform: scale(1.05);
  }

  .btn-end:disabled {
    background: #6b7280;
    cursor: not-allowed;
    transform: none;
  }

  .question-bar {
    position: absolute;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(17, 24, 39, 0.9);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(107, 114, 128, 0.2);
    padding: 1rem 1.5rem;
    border-radius: 12px;
    max-width: 600px;
    text-align: center;
    font-size: 13px;
    color: #d1d5db;
    line-height: 1.5;
  }

  @media (max-width: 768px) {
    .avatar-container {
      gap: 2rem;
      max-width: 100%;
    }

    .avatar {
      width: 120px;
      height: 120px;
      font-size: 48px;
    }

    .participant-name {
      font-size: 14px;
    }

    .question-bar {
      font-size: 12px;
      padding: 0.75rem 1rem;
    }
  }
</style>
</head>
<body>

<main>
  <div class="interview-header">
    <span class="status-dot"></span>
    <span>Interview live</span>
  </div>

  <div class="avatar-container">
    <!-- AI Interviewer -->
    <div class="participant">
      <div class="activity-dots">
        <span class="activity-dot active"></span>
        <span class="activity-dot active"></span>
        <span class="activity-dot active"></span>
        <span class="activity-dot active"></span>
        <span class="activity-dot active"></span>
        <span class="activity-dot active"></span>
      </div>
      <div class="avatar ai">👨‍💼</div>
      <div class="participant-info">
        <p class="participant-name">Interviewer</p>
        <p class="participant-status" id="aiStatus">Listening</p>
      </div>
    </div>

    <!-- You (Candidate) -->
    <div class="participant">
      <div class="activity-dots">
        <span class="activity-dot"></span>
        <span class="activity-dot"></span>
        <span class="activity-dot"></span>
        <span class="activity-dot"></span>
        <span class="activity-dot"></span>
        <span class="activity-dot"></span>
      </div>
      <div class="avatar user">👤</div>
      <div class="participant-info">
        <p class="participant-name">You</p>
        <p class="participant-status" id="userStatus">Mic on</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn-end" id="endBtn" onclick="window.history.back()">
      ✕ End interview
    </button>
  </div>

  <div class="question-bar" id="questionBar">
    Loading interview question...
  </div>
</main>

<script>
  // Configuration for different environments
  (function() {
    const hostname = window.location.hostname;
    if (hostname.includes('openhire-sable.vercel.app')) {
      window.OPENHIRE_API_URL = 'https://openhire-xc9c.onrender.com';
      window.OPENHIRE_API_HOST = 'openhire-xc9c.onrender.com';
    } else {
      window.OPENHIRE_API_URL = '';
      window.OPENHIRE_API_HOST = location.host;
    }
    console.log('[config] Environment:', hostname, 'API:', window.OPENHIRE_API_URL || 'same-origin');
  })();
</script>
<script src="js/app.js"></script>
<script>
const API_BASE = window.OPENHIRE_API_URL || '';

const urlParams = new URLSearchParams(window.location.search);
const sessionId = urlParams.get('session_id');
let ws = null, stream = null, audioCtx = null, node = null, source = null;
let pcmChunks = [], capturing = false, sourceRate = 48000;
const TARGET_RATE = 16000;

function downsampleTo16k(input, inputRate) {
  if (inputRate === TARGET_RATE) return input;
  const ratio = inputRate / TARGET_RATE;
  const outLength = Math.floor(input.length / ratio);
  const out = new Float32Array(outLength);
  for (let i = 0; i < outLength; i++) {
    const start = Math.floor(i * ratio);
    const end = Math.min(Math.floor((i + 1) * ratio), input.length);
    let sum = 0, n = 0;
    for (let j = start; j < end; j++) { sum += input[j]; n++; }
    out[i] = n ? sum / n : 0;
  }
  return out;
}

function encodeWav(float32, sampleRate) {
  const bytesPerSample = 2;
  const dataSize = float32.length * bytesPerSample;
  const buf = new ArrayBuffer(44 + dataSize);
  const view = new DataView(buf);
  const w = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  w(0, "RIFF");
  view.setUint32(4, 36 + dataSize, true);
  w(8, "WAVE");
  w(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * bytesPerSample, true);
  view.setUint16(32, bytesPerSample, true);
  view.setUint16(34, 16, true);
  w(36, "data");
  view.setUint32(40, dataSize, true);
  let off = 44;
  for (let i = 0; i < float32.length; i++, off += 2) {
    const s = Math.max(-1, Math.min(1, float32[i]));
    view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
  }
  return buf;
}

function b64(buf) {
  let s = "", bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}

function play(b64audio, format) {
  if (!b64audio) return;
  const bin = atob(b64audio);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  const blob = new Blob([arr], { type: format === "mp3" ? "audio/mpeg" : "audio/wav" });
  new Audio(URL.createObjectURL(blob)).play().catch(() => {
    console.log('Autoplay blocked by browser');
  });
}

function updateQuestion(text) {
  document.getElementById('questionBar').textContent = text || 'Loading question...';
}

function updateAIStatus(text) {
  document.getElementById('aiStatus').textContent = text;
}

function updateUserStatus(text) {
  document.getElementById('userStatus').textContent = text;
}

function connectToSession(id) {
  if (!id) return;
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const backendHost = window.OPENHIRE_API_HOST || location.host;
  const wsUrl = `${proto}://${backendHost}/ws/sessions/${encodeURIComponent(id)}`;

  console.log('[voice] Connecting to:', wsUrl);
  ws = new WebSocket(wsUrl);

  ws.onopen = async () => {
    console.log('[voice] Connected');
    updateAIStatus('Listening');
    ws.send(JSON.stringify({ type: "speak_question" }));
  };

  ws.onclose = () => {
    console.log('[voice] Disconnected');
    updateAIStatus('Disconnected');
  };

  ws.onerror = (err) => {
    console.error('[voice] Error:', err);
    updateAIStatus('Connection error');
  };

  ws.onmessage = async (event) => {
    try {
      const msg = JSON.parse(event.data);

      if (msg.type === "error") {
        console.error('[voice] Server error:', msg.error);
        return;
      }

      if (msg.transcript) {
        updateUserStatus('Responded');
      }

      if (msg.next_question) {
        updateQuestion(msg.next_question.question_text);
        updateAIStatus('Listening');
        updateUserStatus('Mic on');
      }

      if (msg.status === "sealed") {
        updateQuestion('Interview completed. Finalizing evaluation...');
        updateAIStatus('Completed');
        setTimeout(() => {
          const appId = new URLSearchParams(window.location.search).get('app_id') || '';
          window.location.href = `report.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(appId)}`;
        }, 1500);
        return;
      }

      play(msg.question_audio_base64, msg.audio_format);
    } catch (e) {
      console.error('[voice] Parse error:', e);
    }
  };
}

async function startRecording() {
  if (!ws || ws.readyState !== WebSocket.OPEN || capturing) return;
  try {
    stream = stream || await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    console.error('[voice] Microphone denied:', e);
    updateUserStatus('Mic denied');
    return;
  }

  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") await audioCtx.resume();
  sourceRate = audioCtx.sampleRate;

  pcmChunks = [];
  capturing = true;
  source = audioCtx.createMediaStreamSource(stream);
  node = audioCtx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = (e) => {
    if (!capturing) return;
    pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  source.connect(node);
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  node.connect(mute);
  mute.connect(audioCtx.destination);

  updateUserStatus('Speaking');
  updateAIStatus('Listening');
}

function stopRecording() {
  if (!capturing) return;
  capturing = false;
  try { source && source.disconnect(); node && node.disconnect(); } catch (e) {}

  const total = pcmChunks.reduce((n, c) => n + c.length, 0);
  if (!total) {
    updateUserStatus('Mic on');
    return;
  }

  const merged = new Float32Array(total);
  let off = 0;
  for (const c of pcmChunks) { merged.set(c, off); off += c.length; }

  const wav = encodeWav(downsampleTo16k(merged, sourceRate), TARGET_RATE);
  updateAIStatus('Evaluating');
  updateUserStatus('Sending...');

  ws.send(JSON.stringify({
    type: "answer",
    audio_base64: b64(wav),
    audio_format: "wav",
    utterance_id: crypto.randomUUID(),
  }));
}

// Mouse/touch controls for recording
document.addEventListener('mousedown', (e) => {
  if (e.target.id === 'endBtn') return;
  if (e.target.closest('.btn-end')) return;
  startRecording();
});

document.addEventListener('mouseup', stopRecording);
document.addEventListener('mouseleave', stopRecording);
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('.btn-end')) startRecording();
});
document.addEventListener('touchend', stopRecording);

// Load session on page load
window.addEventListener('load', () => {
  if (sessionId) {
    connectToSession(sessionId);
  } else {
    updateQuestion('No session ID specified.');
  }
});

// Override end interview button
document.getElementById('endBtn').onclick = async () => {
  const appId = new URLSearchParams(window.location.search).get('app_id') || '';
  try {
    await fetch(`${API_BASE}/sessions/${encodeURIComponent(sessionId)}/finish`, { method: 'POST' });
  } catch (e) {
    console.error('Error finishing session:', e);
  }
  setTimeout(() => {
    window.location.href = `report.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(appId)}`;
  }, 500);
};
</script>

</body>
</html>
