<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Candidate Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="container">
  <div class="card-header" style="margin-bottom:1.5rem;">
    <div>
      <h2 class="card-title">Candidate Dashboard</h2>
      <p class="card-sub">Browse open drives, apply with your resume, and launch your voice interview.</p>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">Available Positions</h3>
      <span class="tag">Active</span>
    </div>
    <div id="candidateJobList" class="grid-2" style="margin-top:0.25rem;">
      <!-- Dynamic list -->
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">My Applications</h3>
    </div>
    <div id="candidateApplicationsList">
      <!-- Applications list -->
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  guardAuthenticatedPage();
  renderNavbar('dashboard');

  const listEl = document.getElementById('candidateJobList');
  const appListEl = document.getElementById('candidateApplicationsList');
  listEl.innerHTML = '<p class="card-sub">Loading postings…</p>';
  appListEl.innerHTML = '<p class="card-sub">Loading applications…</p>';

  (async () => {
    try {
      const jobs = await fetchJobs();
      listEl.innerHTML = jobs.length ? jobs.map(job => `
        <div class="job-card" onclick="window.location.href='job-detail.html?job_id=${encodeURIComponent(job.job_id)}'">
          <h4 style="font-weight:600; font-size:1rem; margin-bottom:0.35rem;">${job.title || job.job_id}</h4>
          <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">
            ${(job.description || '').substring(0, 100)}...
          </p>
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span class="tag">${job.competencies.length} Skills</span>
            <button class="btn-primary" style="padding:0.3rem 0.75rem; font-size:12px;" onclick="event.stopPropagation(); window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'">
              Apply →
            </button>
          </div>
        </div>
      `).join('') : '<p class="card-sub">No open positions right now.</p>';
    } catch (err) {
      listEl.innerHTML = `<p class="card-sub" style="color:var(--danger, #ef4444);">Could not load jobs: ${err.message}</p>`;
    }

    const user = await resolveCandidateId();
    if (!user.candidate_id) {
      appListEl.innerHTML = '<p class="card-sub">No active applications. Apply to a position above.</p>';
      return;
    }

    try {
      const apps = await fetchApplicationsForCandidate(user.candidate_id);
      if (!apps.length) {
        appListEl.innerHTML = '<p class="card-sub">No active applications. Apply to a position above.</p>';
        return;
      }
      appListEl.innerHTML = `
        <div style="background:var(--primary-subtle, #eff6ff); border:1px solid rgba(59,130,246,0.2); border-radius:var(--radius); padding:0.75rem 1rem; margin-bottom:1rem; font-size:0.85rem; color:var(--text-main);">
          💡 <strong>On-Demand AI Interviews:</strong> Shortlisted candidates can take their structured voice interview at any time. When ready, click <strong>Launch Interview</strong>.
        </div>
      ` + apps.map(app => {
        const rubricPct = app.matching_score && app.matching_score.match_score != null
          ? Math.round(app.matching_score.match_score * 100) : null;
        const semanticPct = app.semantic_score != null
          ? Math.round(app.semantic_score * 100) : null;
        const matchPct = rubricPct !== null ? rubricPct : semanticPct;
        const matchLabel = rubricPct !== null ? 'Rubric match' : (semanticPct !== null ? 'Semantic match' : 'Match fit');
        const canInterview = app.status === 'shortlisted' || app.status === 'interview_linked';
        
        let statusBadge;
        if (app.status === 'shortlisted') {
          statusBadge = '<span class="tag" style="background:var(--success-subtle); color:var(--success-text); border-color:rgba(16,185,129,0.3); font-weight:600;">Shortlisted — Interview Ready</span>';
        } else if (app.status === 'interview_linked') {
          statusBadge = '<span class="tag" style="background:var(--primary-subtle); color:var(--primary); border-color:var(--primary-glow); font-weight:600;">Interview Linked</span>';
        } else if (app.status === 'rejected') {
          statusBadge = '<span class="tag">Not Shortlisted</span>';
        } else if (app.status === 'needs_human_review') {
          statusBadge = '<span class="tag" style="background:var(--warning-subtle); color:var(--warning-text); border-color:rgba(245,158,11,0.3);">Under Review</span>';
        } else {
          statusBadge = `<span class="tag">${app.status.replace(/_/g, ' ')}</span>`;
        }

        return `
        <div class="card" style="margin-bottom:0.75rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; padding:1rem 1.25rem;">
          <div style="flex:1; min-width:240px;">
            <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.35rem;">
              <h4 style="font-weight:600; font-size:1.05rem; margin:0;">Role: ${app.job_id}</h4>
              ${statusBadge}
            </div>
            <p class="card-sub" style="margin:0;">
              ${matchLabel}: <strong style="color:var(--primary); font-family:var(--font-mono);">${matchPct !== null ? matchPct + '%' : 'pending'}</strong>
              ${canInterview ? ' · <span style="color:var(--success-text); font-weight:500;">Eligible for on-demand interview</span>' : ''}
            </p>
          </div>
          <div style="display:flex; gap:0.5rem; align-items:center;">
            ${canInterview ? `
              <button class="btn-primary" style="padding:0.45rem 1rem; font-size:13px;" onclick="launchInterview('${app.application_id}')">
                ${app.status === 'interview_linked' ? 'Resume Interview' : 'Launch Interview'}
              </button>
            ` : ''}
            <button class="btn-outline" style="padding:0.45rem 0.8rem; font-size:12.5px;" onclick="window.location.href='report.html?app_id=${encodeURIComponent(app.application_id)}'">
              Report
            </button>
          </div>
        </div>
      `;
      }).join('');
    } catch (err) {
      appListEl.innerHTML = `<p class="card-sub" style="color:var(--danger, #ef4444);">Could not load applications: ${err.message}</p>`;
    }
  })();

  async function launchInterview(applicationId) {
    try {
      const record = await apiRequest(`/applications/${encodeURIComponent(applicationId)}`);
      const sessionId = await ensureInterviewSession(record.application);
      window.location.href = `interview.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(applicationId)}`;
    } catch (err) {
      alert(`Could not start the interview: ${err.message}`);
    }
  }
</script>
</body>
</html>
