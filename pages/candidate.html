<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Candidate Hub</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="card-header">
    <div>
      <h2 class="card-title">Candidate Hub</h2>
      <p class="card-sub">Browse open roles, apply with your resume, and launch your adaptive voice interview.</p>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title" style="font-size:1.1rem; margin-bottom:1rem;">Available Job Positions</h3>
    <div id="candidateJobList" class="grid-2">
      <!-- Dynamic list -->
    </div>
  </div>

  <div class="card">
    <h3 class="card-title" style="font-size:1.1rem; margin-bottom:1rem;">My Applications & Interviews</h3>
    <div id="candidateApplicationsList">
      <!-- Applications list -->
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar('dashboard');

  const jobs = getStoredJobs();
  const listEl = document.getElementById('candidateJobList');

  listEl.innerHTML = jobs.map(job => `
    <div class="job-card" onclick="window.location.href='job-detail.html?job_id=${encodeURIComponent(job.job_id)}'">
      <h4 style="font-weight:700; font-size:1.05rem; margin-bottom:0.4rem;">${job.title || job.job_id}</h4>
      <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:0.75rem;">
        ${(job.description || '').substring(0, 110)}...
      </p>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="tag">${(job.competencies || []).length} Competencies</span>
        <button class="btn-primary" style="padding:0.35rem 0.85rem; font-size:0.8rem;" onclick="event.stopPropagation(); window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'">
          Apply Now
        </button>
      </div>
    </div>
  `).join('');

  const apps = getStoredApplications();
  const appListEl = document.getElementById('candidateApplicationsList');

  if (!apps.length) {
    appListEl.innerHTML = '<p class="card-sub">You have no active applications yet. Select a role above to apply!</p>';
  } else {
    appListEl.innerHTML = apps.map(app => `
      <div class="card" style="margin-bottom:0.75rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
        <div>
          <h4 style="font-weight:700;">Role: ${app.job_id}</h4>
          <p class="card-sub">Match Score: <strong style="color:var(--primary);">${app.match_score || 88}%</strong> | Status: <span class="tag">${app.status || 'SHORTLISTED'}</span></p>
        </div>
        <div style="display:flex; gap:0.5rem;">
          <button class="btn-primary" onclick="window.location.href='interview.html?session_id=${encodeURIComponent(app.session_id || 'sess-01')}&app_id=${encodeURIComponent(app.application_id)}'">🎙️ Launch AI Interview</button>
          <button class="btn-outline" onclick="window.location.href='report.html?app_id=${encodeURIComponent(app.application_id)}'">View Report</button>
        </div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
