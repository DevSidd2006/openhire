<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="card-header" style="margin-bottom:1.5rem;">
    <div>
      <h2 class="card-title">Candidate Leaderboard</h2>
      <p class="card-sub" id="leaderboardMeta">Ranked applicant shortlist scored by <code>LeaderboardAgent</code>.</p>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn-secondary" onclick="reMatchShortlist()">⚡ Run Matcher</button>
      <button class="btn-outline" onclick="window.history.back()">Back</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Candidate</th>
            <th>Match</th>
            <th>Score</th>
            <th>Verdict</th>
            <th>Integrity Flags</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leaderboardTableBody">
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar('leaderboard');

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id');
  if (jobId) {
    document.getElementById('leaderboardMeta').textContent = `Ranked applicants for role: ${jobId}`;
  }

  function loadLeaderboard() {
    const apps = getStoredApplications();
    const defaultCandidates = [
      { candidate_name: "Alex Morgan", match_score: 94, final_score: 89, recommendation: "STRONG HIRE", flags: "0 Flags", application_id: "app-01" },
      { candidate_name: "Jordan Lee", match_score: 88, final_score: 84, recommendation: "HIRE", flags: "0 Flags", application_id: "app-02" },
      { candidate_name: "Sam Taylor", match_score: 79, final_score: 73, recommendation: "REVIEW", flags: "1 Discrepancy", application_id: "app-03" }
    ];

    const displayList = apps.length ? apps.map((a, idx) => ({
      candidate_name: a.candidate_name,
      match_score: a.match_score || 88,
      final_score: a.final_score || 87,
      recommendation: a.recommendation || "STRONG HIRE",
      flags: "0 Flags",
      application_id: a.application_id
    })).concat(defaultCandidates) : defaultCandidates;

    const tbody = document.getElementById('leaderboardTableBody');
    tbody.innerHTML = displayList.map((c, idx) => `
      <tr>
        <td style="font-family:var(--font-mono); font-weight:600; color:var(--primary);">#${idx + 1}</td>
        <td><strong style="color:var(--text-main);">${c.candidate_name}</strong></td>
        <td><span class="score-pill high">${c.match_score}%</span></td>
        <td><span class="score-pill high">${c.final_score}</span></td>
        <td><span class="tag" style="color:var(--success); border-color:rgba(16,185,129,0.25); font-weight:500;">${c.recommendation}</span></td>
        <td><span style="font-size:11.5px; font-family:var(--font-mono); color:${c.flags.includes('0') ? 'var(--success)' : 'var(--warning)'};">${c.flags}</span></td>
        <td>
          <button class="btn-outline" style="padding:0.25rem 0.6rem; font-size:11.5px;" onclick="window.location.href='report.html?app_id=${encodeURIComponent(c.application_id)}'">
            Report →
          </button>
        </td>
      </tr>
    `).join('');
  }

  function reMatchShortlist() {
    alert('Executed Resume Matcher across candidates. Ranks refreshed!');
    loadLeaderboard();
  }

  loadLeaderboard();
</script>
</body>
</html>
