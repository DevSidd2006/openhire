<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="card-header" style="margin-bottom:1.5rem;">
    <div>
      <h2 class="card-title">Candidate Leaderboard</h2>
      <p class="card-sub" id="leaderboardMeta">Ranked applicant shortlist scored by <code>LeaderboardAgent</code>.</p>
    </div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn-secondary" onclick="reMatchShortlist()">⚡ Run Matcher</button>
      <button class="btn-outline" onclick="window.history.back()">Back</button>
    </div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Candidate</th>
            <th>Match</th>
            <th>Score</th>
            <th>Verdict</th>
            <th>Integrity Flags</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="leaderboardTableBody">
          <!-- Populated via JS -->
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar('leaderboard');

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id');
  const tbody = document.getElementById('leaderboardTableBody');

  if (jobId) {
    document.getElementById('leaderboardMeta').textContent = `Ranked applicants for role: ${jobId}`;
  } else {
    document.getElementById('leaderboardMeta').textContent = 'No job selected.';
    tbody.innerHTML = '<tr><td colspan="7" class="card-sub">Open this page from a specific job (Recruiter Dashboard → a posting → Leaderboard) to see its ranked candidates.</td></tr>';
  }

  async function loadLeaderboard() {
    if (!jobId) return;
    tbody.innerHTML = '<tr><td colspan="7" class="card-sub">Loading leaderboard…</td></tr>';
    try {
      const data = await apiRequest(`/jobs/${encodeURIComponent(jobId)}/leaderboard`);
      const entries = data.leaderboard.entries || [];
      const incomplete = data.leaderboard.incomplete_candidates || [];

      if (!entries.length && !incomplete.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="card-sub">No shortlisted candidates yet for this job.</td></tr>';
        return;
      }

      const rows = entries.map((c, idx) => `
        <tr>
          <td style="font-family:var(--font-mono); font-weight:600; color:var(--primary);">#${c.rank}</td>
          <td><strong style="color:var(--text-main);">${c.candidate_name}</strong></td>
          <td><span class="score-pill high">${c.job_fit_score.toFixed(1)}/10</span></td>
          <td><span class="score-pill high">${c.weighted_score.toFixed(1)}</span></td>
          <td><span class="tag" style="color:var(--success); border-color:rgba(16,185,129,0.25); font-weight:500;">${c.recommendation.replace(/_/g, ' ')}</span></td>
          <td><span style="font-size:11.5px; font-family:var(--font-mono); color:${(c.has_integrity_issues || c.has_bias_concerns) ? 'var(--warning)' : 'var(--success)'};">${(c.has_integrity_issues || c.has_bias_concerns) ? 'Flagged' : '0 Flags'}</span></td>
          <td>
            <button class="btn-outline" style="padding:0.25rem 0.6rem; font-size:11.5px;" onclick="window.location.href='report.html?job_id=${encodeURIComponent(jobId)}&candidate_id=${encodeURIComponent(c.candidate_id)}'">
              Report →
            </button>
          </td>
        </tr>
      `);

      const incompleteRows = incomplete.map(candidateId => `
        <tr>
          <td>—</td>
          <td><strong style="color:var(--text-main);">${candidateId}</strong></td>
          <td colspan="4" class="card-sub">Evaluation not yet complete</td>
          <td></td>
        </tr>
      `);

      tbody.innerHTML = rows.concat(incompleteRows).join('');
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="7" class="card-sub" style="color:var(--danger, #ef4444);">Could not load leaderboard: ${err.message}</td></tr>`;
    }
  }

  async function reMatchShortlist() {
    if (!jobId) {
      alert('Select a job first.');
      return;
    }
    try {
      const result = await apiRequest(`/jobs/${encodeURIComponent(jobId)}/match`, { method: 'POST' });
      alert(`Matcher ran: ${result.matched} matched, ${result.shortlisted} shortlisted, ${result.rejected} rejected.`);
      loadLeaderboard();
    } catch (err) {
      alert(`Could not run the matcher: ${err.message}`);
    }
  }

  loadLeaderboard();
</script>
</body>
</html>
