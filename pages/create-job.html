<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Post New Job</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div style="max-width: 720px; margin: 0 auto;" class="card">
    <div class="card-header">
      <h2 class="card-title">Post New Job Description</h2>
      <button class="btn-outline" onclick="window.location.href='recruiter.html'">Back</button>
    </div>
    <p class="card-sub" style="margin-bottom:1.5rem;">
      Paste your raw Job Description. The <code>JDAnalyzerAgent</code> extracts the competency rubric, core skills, and evaluation weights.
    </p>
    
    <div class="form-group">
      <label class="form-label">Job Title / Identifier</label>
      <input type="text" id="jobTitle" class="form-control" placeholder="e.g. Distributed Systems Engineer">
    </div>

    <div class="form-group">
      <label class="form-label">Job Description Text</label>
      <textarea id="jobDescription" class="form-control" rows="8" placeholder="We are seeking an engineer experienced in Python, high-throughput microservices, PostgreSQL, and distributed caching..."></textarea>
    </div>

    <button class="btn-primary" id="btnSubmit" style="width:100%;" onclick="handleJobCreate()">Analyze & Publish Position</button>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar('dashboard');

  function handleJobCreate() {
    const title = document.getElementById('jobTitle').value.trim();
    const desc = document.getElementById('jobDescription').value.trim();
    if (!desc) {
      alert('Please provide a job description.');
      return;
    }

    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Analyzing JD with Agent...';

    const jobs = getStoredJobs();
    const newJob = {
      job_id: (title ? title.toLowerCase().replace(/\s+/g, '-') : 'job-' + Date.now()),
      title: title || 'Software Engineer',
      description: desc,
      competencies: ['System Architecture', 'Core Competencies', 'Problem Solving']
    };

    jobs.unshift(newJob);
    saveJobs(jobs);

    setTimeout(() => {
      alert('Job successfully parsed and published!');
      window.location.href = 'recruiter.html';
    }, 600);
  }
</script>
</body>
</html>
