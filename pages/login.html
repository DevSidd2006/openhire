<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 100;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 clamp(1rem, 4vw, 2.5rem);
    background: rgba(247, 246, 243, 0.85);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid var(--surface-border);
  }
  .site-nav .brand,
  .site-nav .links a {
    color: var(--ink);
    text-decoration: none;
  }
  .site-nav .brand {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    font-weight: 600;
    font-size: 0.95rem;
  }
  .mark-tile {
    width: 26px;
    height: 26px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .mark-tile img { width: 24px; height: 24px; }
  .site-nav .links,
  .site-nav .right {
    display: flex;
    align-items: center;
  }
  .site-nav .links { gap: 0.35rem; }
  .site-nav .links a {
    color: var(--ink-3);
    font-size: 0.8rem;
    font-weight: 500;
    padding: 0.4rem 0.85rem;
    border-radius: var(--radius);
  }
  .site-nav .right { gap: 0.9rem; }
  .site-nav .github-link {
    color: var(--ink-2);
    text-decoration: none;
    display: inline-flex;
  }
  .site-nav .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.7rem 1.4rem;
    border: 1px solid transparent;
    border-radius: var(--radius);
    font-size: 0.86rem;
    font-weight: 500;
    line-height: 1;
    text-decoration: none;
    white-space: nowrap;
  }
  @media (max-width: 640px) {
    .site-nav .links { display: none; }
  }
  @media (max-width: 420px) {
    .site-nav .github-link { display: none; }
  }
</style>
</head>
<body>
<nav class="site-nav">
  <a href="index.html" class="brand">
    <span class="mark-tile"><img src="assets/openhire.svg" alt="OpenHire logo"></span>
    OpenHire
  </a>
  <div class="links">
    <a href="index.html#how">How it works</a>
    <a href="index.html#features">Features</a>
  </div>
  <div class="right">
    <a class="github-link"  aria-label="OpenHire on GitHub"><i class="ph-bold ph-github-logo" aria-placeholder="false" aria-disabled="true" ></i></a>
    <a href="login.html" class="btn btn-primary" aria-current="page"><i class="ph-bold ph-arrow-right" aria-hidden="true"></i>Get Started</a>
  </div>
</nav>
<div id="impersonationBanner"></div>

<main class="auth-shell">
  <div class="auth-card reveal">
    <div class="auth-mark">
      <img src="assets/openhire.svg" alt="OpenHire logo">
    </div>
    <h1 class="auth-title">Log into OpenHire</h1>
    <p class="auth-sub">Enter your credentials to access your account.</p>

    <div id="errorMessage" class="alert alert-danger auth-error" style="display:none; margin-bottom:1rem;"></div>

    <div class="auth-social">
      <button type="button" class="auth-social-btn" disabled title="LinkedIn sign-in coming soon"><i class="ph-bold ph-linkedin-logo" aria-hidden="true"></i>Continue with LinkedIn</button>
    </div>
    <div class="auth-divider">or</div>

    <form class="auth-form" onsubmit="event.preventDefault(); handleLoginSubmit();">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="e.g. name@company.com" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
      </div>

      <button id="submitBtn" type="submit" class="btn-primary auth-submit">Log In</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </p>
  </div>
</main>

<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script>
  async function handleLoginSubmit() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // Validation
    if (!email || !password) {
      errorDiv.textContent = 'Please enter both email and password.';
      errorDiv.style.display = 'block';
      return;
    }

    if (!email.includes('@')) {
      errorDiv.textContent = 'Please enter a valid email address.';
      errorDiv.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';
    errorDiv.style.display = 'none';

    try {
      const response = await apiRequest('/auth/login', {
        method: 'POST',
        body: {
          email,
          password,
        },
      });

      // Store tokens and user info
      setTokens(response.access_token, response.refresh_token);
      setCurrentUser({
        name: response.user.email,
        role: response.user.user_type,
        user_id: response.user.user_id,
      });
      // Re-resolve candidate_id from the backend rather than leaving it
      // wiped until the dashboard's own self-heal runs - see
      // resolveCandidateId()'s doc comment in js/app.js for why this
      // matters (a returning candidate's applications showing as zero).
      if (response.user.user_type === 'candidate') {
        await resolveCandidateId();
      }

      // Redirect to appropriate dashboard
      let dashboard;
      if (response.user.user_type === 'admin') {
        dashboard = 'admin.html';
      } else if (response.user.user_type === 'recruiter') {
        dashboard = 'recruiter.html';
      } else {
        dashboard = 'candidate.html';
      }
      window.location.href = dashboard;
    } catch (error) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
      errorDiv.textContent = error.message || 'Login failed. Please check your credentials.';
      errorDiv.style.display = 'block';
    }
  }
</script>
