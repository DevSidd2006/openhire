<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Job Details</title>
<link rel="icon" type="image/svg+xml" href="assets/openhire.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="container">
  <div class="page-head reveal" style="margin-bottom:1.5rem;">
    <div class="eyebrow">job / posting</div>
    <h1 class="page-title" id="jobTitle" style="font-size:1.9rem;">Job Title</h1>
    <p class="card-sub" id="jobMeta" style="font-family:var(--font-mono);">Role ID: —</p>
    <div class="page-actions" id="jobActions" style="margin-top:1.25rem;"></div>
  </div>

  <div class="grid-2">
    <div class="card reveal">
      <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.75rem;">Required Competencies</h3>
      <div id="jobCompetencies" style="display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1.25rem;"></div>

      <h4 style="font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-3); margin-bottom:0.4rem;">Description</h4>
      <p id="jobDescription" style="font-size:0.9rem; color:var(--ink-2); white-space:pre-wrap; line-height:1.6;"></p>
    </div>

    <div class="card reveal" id="jobSidebar">
      <!-- Role sidebar action card -->
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  guardAuthenticatedPage();
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id');
  const user = getCurrentUser();

  (async () => {
    if (!jobId) {
      document.getElementById('jobTitle').textContent = 'No job selected';
      document.getElementById('jobMeta').textContent = '—';
      return;
    }

    let job;
    try {
      job = await fetchJob(jobId);
    } catch (err) {
      document.getElementById('jobTitle').textContent = 'Job not found';
      document.getElementById('jobMeta').textContent = err.message;
      return;
    }

    const openingsCount = job.openings || 1;
    document.getElementById('jobTitle').textContent = job.title || job.job_id;
    document.getElementById('jobMeta').textContent = `Role ID: ${job.job_id} · ${openingsCount} ${openingsCount === 1 ? 'Opening' : 'Openings'}`;
    document.getElementById('jobDescription').textContent = job.description;

    const compEl = document.getElementById('jobCompetencies');
    const openingsTag = `<span class="chip chip-success">${openingsCount} ${openingsCount === 1 ? 'Opening' : 'Openings'}</span>`;
    compEl.innerHTML = openingsTag + (job.competencies.length ? job.competencies : ['Technical Assessment', 'Communication']).map(c => `
      <span class="chip"><i class="ph-bold ph-check" style="margin-right:0.3rem;"></i>${c}</span>
    `).join('');

    const actionsEl = document.getElementById('jobActions');
    const sidebarEl = document.getElementById('jobSidebar');

    if (user && user.role === 'recruiter') {
      actionsEl.innerHTML = `
        <button class="btn-primary" onclick="window.location.href='screening.html?job_id=${encodeURIComponent(job.job_id)}'"><i class="ph-bold ph-file-text"></i>All Resumes & Screening</button>
        <button class="btn-secondary" onclick="window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'"><i class="ph-bold ph-ranking"></i>Final Leaderboard</button>
      `;
      sidebarEl.innerHTML = `
        <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.5rem;">Recruiter Panel</h3>
        <p class="card-sub" style="margin-bottom:1rem;">Applicants are automatically screened and shortlisted against this role. Shortlisted candidates can take their voice interview on-demand at any time.</p>
        <div id="rubricPanel" style="margin-bottom:1rem;"></div>
        <button class="btn-secondary" style="width:100%; margin-bottom:0.5rem;" onclick="window.location.href='screening.html?job_id=${encodeURIComponent(job.job_id)}'"><i class="ph-bold ph-file-text"></i>All Resumes & Screening</button>
        <button class="btn-outline" style="width:100%; margin-bottom:0.5rem;" onclick="window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'"><i class="ph-bold ph-ranking"></i>Final Leaderboard (post-interview)</button>
      `;
      loadRubricPanel();
    } else {
      actionsEl.innerHTML = `
        <button class="btn-primary" onclick="window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'"><i class="ph-bold ph-paper-plane-tilt"></i>Apply Now</button>
      `;
      sidebarEl.innerHTML = `
        <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.5rem;">Ready to Apply?</h3>
        <p class="card-sub" style="margin-bottom:1rem;">Submit your CV to match qualifications and generate your adaptive interview invite.</p>
        <button class="btn-primary" style="width:100%;" onclick="window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'">Submit Resume Application</button>
      `;
    }
  })();

  // ------------------------------------------------------------------
  // Rubric lifecycle.
  //
  // A job is not scorable until a recruiter APPROVES a rubric: the rubric
  // decides every ranking on the job, so an unreviewed one silently corrupts
  // the whole leaderboard. Drafting is automated; approving deliberately is
  // not, which is why these are two separate buttons and never one.
  // ------------------------------------------------------------------

  function esc(text) {
    return String(text == null ? '' : text)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  async function loadRubricPanel() {
    const el = document.getElementById('rubricPanel');
    if (!el) return;
    el.innerHTML = '<p class="card-sub">Checking rubric…</p>';

    let versions = [];
    try {
      const data = await apiRequest(`/jobs/${encodeURIComponent(jobId)}/rubric/versions`);
      versions = data.versions || [];
    } catch (err) {
      el.innerHTML = `<p class="card-sub">Could not load rubric versions: ${esc(err.message)}</p>`;
      return;
    }

    const approved = versions.find(v => v.status === 'approved');
    const drafts = versions.filter(v => v.status === 'draft');

    if (approved) {
      el.innerHTML = `
        <p class="card-sub" style="margin-bottom:0.5rem;">
          <strong style="color:var(--success);">Rubric v${approved.version} approved</strong> —
          ${approved.competencies.length} competencies. This job is scorable.
        </p>
        ${competencyTags(approved)}
        <button class="btn-outline" style="width:100%; margin-top:0.5rem;" onclick="draftRubric()">Draft a new version</button>`;
      return;
    }

    if (drafts.length) {
      const latest = drafts[drafts.length - 1];
      el.innerHTML = `
        <p class="card-sub" style="margin-bottom:0.5rem;">
          <strong style="color:var(--warning);">Rubric v${latest.version} is a draft.</strong>
          Nothing can be scored until you approve it. Read the competencies before approving —
          an unreviewed rubric affects every ranking on this job.
        </p>
        ${competencyTags(latest)}
        <button class="btn-primary" style="width:100%; margin-top:0.5rem;" onclick="approveRubric('${latest.rubric_id}')">Approve v${latest.version}</button>
        <button class="btn-outline" style="width:100%; margin-top:0.4rem;" onclick="draftRubric()">Re-draft</button>`;
      return;
    }

    el.innerHTML = `
      <p class="card-sub" style="margin-bottom:0.5rem;">
        <strong style="color:var(--warning);">No rubric yet.</strong>
        Applicants to this job cannot be scored against reviewed criteria until one is approved.
      </p>
      <button class="btn-primary" style="width:100%;" onclick="draftRubric()">Draft rubric from job description</button>`;
  }

  function competencyTags(rubric) {
    return `<div style="display:flex; flex-wrap:wrap; gap:0.3rem;">${
      rubric.competencies.map(c =>
        `<span class="tag" title="${esc(c.definition)}">${esc(c.name)} · ${Math.round(c.weight * 100)}%</span>`
      ).join('')
    }</div>`;
  }

  async function draftRubric() {
    const el = document.getElementById('rubricPanel');
    el.innerHTML = '<p class="card-sub">Drafting rubric from the job description…</p>';
    try {
      await apiRequest(`/jobs/${encodeURIComponent(jobId)}/rubric/draft`, { method: 'POST' });
      loadRubricPanel();
    } catch (err) {
      el.innerHTML = `<p class="card-sub">Could not draft a rubric: ${esc(err.message)}</p>`;
    }
  }

  async function approveRubric(rubricId) {
    if (!confirm('Approve this rubric? It becomes the basis for every ranking on this job.')) return;
    try {
      await apiRequest(`/jobs/${encodeURIComponent(jobId)}/rubric/${encodeURIComponent(rubricId)}/approve`, { method: 'POST' });
      loadRubricPanel();
    } catch (err) {
      // The approval gate reports every violation at once, so show it verbatim.
      alert(`Could not approve this rubric: ${err.message}`);
    }
  }
</script>
</body>
</html>
