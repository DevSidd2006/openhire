<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Job Details</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div class="card-header">
    <div>
      <h2 class="card-title" id="jobTitle">Job Title</h2>
      <p class="card-sub" id="jobMeta">Job ID: —</p>
    </div>
    <div id="jobActions"></div>
  </div>

  <div class="grid-2">
    <div class="card">
      <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.75rem;">Required Competencies & Skills</h3>
      <div id="jobCompetencies" style="display:flex; flex-wrap:wrap; gap:0.5rem; margin-bottom:1.5rem;"></div>
      
      <h4 style="font-size:0.9rem; color:var(--text-muted); margin-bottom:0.5rem;">Job Description</h4>
      <p id="jobDescription" style="font-size:0.9rem; color:var(--text-main); white-space:pre-wrap;"></p>
    </div>

    <div class="card" id="jobSidebar">
      <!-- Dynamic role card -->
    </div>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id') || 'backend-lead-01';
  const user = getCurrentUser();

  const jobs = getStoredJobs();
  const job = jobs.find(j => j.job_id === jobId) || {
    job_id: jobId,
    title: jobId,
    description: "Detailed job description...",
    competencies: ["System Design", "Engineering", "Algorithms"]
  };

  document.getElementById('jobTitle').textContent = job.title || job.job_id;
  document.getElementById('jobMeta').textContent = `Reference: ${job.job_id}`;
  document.getElementById('jobDescription').textContent = job.description;

  const compEl = document.getElementById('jobCompetencies');
  compEl.innerHTML = (job.competencies || ['Technical Assessment', 'Communication']).map(c => `
    <span class="tag" style="background:var(--primary-glow); color:var(--primary); font-weight:600; padding:0.35rem 0.75rem;">
      ✓ ${c}
    </span>
  `).join('');

  const actionsEl = document.getElementById('jobActions');
  const sidebarEl = document.getElementById('jobSidebar');

  if (user && user.role === 'recruiter') {
    actionsEl.innerHTML = `
      <button class="btn-primary" onclick="window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'">Inspect Leaderboard</button>
    `;
    sidebarEl.innerHTML = `
      <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.75rem;">Recruiter Panel</h3>
      <p class="card-sub" style="margin-bottom:1.25rem;">Candidates submitting resumes will be evaluated automatically against this job rubric.</p>
      <button class="btn-secondary" style="width:100%;" onclick="window.location.href='leaderboard.html?job_id=${encodeURIComponent(job.job_id)}'">View Candidate Shortlist & Audits</button>
    `;
  } else {
    actionsEl.innerHTML = `
      <button class="btn-primary" onclick="window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'">Apply Now</button>
    `;
    sidebarEl.innerHTML = `
      <h3 class="card-title" style="font-size:1.05rem; margin-bottom:0.75rem;">Submit Application</h3>
      <p class="card-sub" style="margin-bottom:1.25rem;">Paste your resume to get matched by the Resume Matcher Agent and receive your AI voice interview invite.</p>
      <button class="btn-primary" style="width:100%;" onclick="window.location.href='apply.html?job_id=${encodeURIComponent(job.job_id)}'">Apply with Resume</button>
    `;
  }
</script>
</body>
</html>
