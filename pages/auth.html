<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Sign In & Role Selection</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div style="max-width: 460px; margin: 3rem auto;" class="card">
    <div class="card-header">
      <h2 class="card-title">Sign In / Role Selection</h2>
    </div>
    <p class="card-sub" style="margin-bottom:1.5rem;">Select your workspace role to enter the recruitment or interview portal.</p>
    
    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="userName" class="form-control" placeholder="e.g. Alex Morgan" value="Alex Morgan">
    </div>

    <div class="form-group">
      <label class="form-label">Select Role</label>
      <select id="userRole" class="form-control">
        <option value="recruiter">👔 Recruiter (Post Jobs, Manage Shortlists & Audits)</option>
        <option value="candidate" selected>🎓 Candidate (Browse Jobs, Apply & Take AI Interview)</option>
      </select>
    </div>

    <button class="btn-primary" style="width:100%; margin-top:1rem;" onclick="handleLoginSubmit()">Continue to Portal</button>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  function handleLoginSubmit() {
    const name = document.getElementById('userName').value.trim() || 'User';
    const role = document.getElementById('userRole').value;
    setCurrentUser({ name, role });

    if (role === 'recruiter') {
      window.location.href = 'recruiter.html';
    } else {
      window.location.href = 'candidate.html';
    }
  }
</script>
</body>
</html>
