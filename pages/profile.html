<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Profile</title>
<link rel="icon" type="image/svg+xml" href="assets/openhire.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="css/style.css?v=byok-ui-polish">
<script src="js/theme.js"></script>
</head>
<body>
<div id="navbarContainer"></div>
<div id="impersonationBanner"></div>

<main class="container">
  <div class="page-head reveal">
    <div class="eyebrow">account / settings</div>
    <h1 class="page-title">Your Profile</h1>
    <p class="card-sub">Account details, role information, and security settings.</p>
  </div>

  <div class="card reveal">
    <div class="profile-header-row">
      <div class="profile-avatar" id="profileAvatar">?</div>
      <div>
        <h3 class="card-title" id="profileName" style="font-size:1.1rem;">—</h3>
        <p class="card-sub" id="profileEmail" style="margin:0.15rem 0;">—</p>
        <span class="chip" id="profileRoleTag">—</span>
        <span class="card-sub" id="profileMemberSince" style="margin-left:0.5rem;"></span>
      </div>
    </div>
  </div>

  <div class="card reveal">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">Account Details</h3>
    </div>
    <form id="accountForm">
      <div class="form-group">
        <label class="form-label" for="fullName">Full name</label>
        <input class="form-control" id="fullName" name="full_name" type="text">
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-control" id="phone" name="phone" type="text">
      </div>
      <div class="form-group">
        <label class="form-label" for="location">Location</label>
        <input class="form-control" id="location" name="location" type="text">
      </div>
      <div class="form-group">
        <label class="form-label" for="headline">Headline</label>
        <input class="form-control" id="headline" name="headline" type="text" placeholder="e.g. Senior Backend Engineer">
      </div>
      <div class="form-group">
        <label class="form-label" for="bio">Bio</label>
        <textarea class="form-control" id="bio" name="bio" rows="3"></textarea>
      </div>
      <button type="submit" class="btn-primary">Save changes</button>
      <div class="form-status" id="accountFormStatus"></div>
    </form>
  </div>

  <div class="card reveal" id="roleCard" hidden>
    <!-- Populated by JS: recruiter company form, or candidate read-only resume summary. -->
  </div>

  <div class="card reveal">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">Security</h3>
    </div>
    <form id="passwordForm">
      <div class="form-group">
        <label class="form-label" for="currentPassword">Current password</label>
        <input class="form-control" id="currentPassword" name="current_password" type="password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="newPassword">New password</label>
        <input class="form-control" id="newPassword" name="new_password" type="password" minlength="8" required>
      </div>
      <button type="submit" class="btn-primary">Change password</button>
      <div class="form-status" id="passwordFormStatus"></div>
    </form>
  </div>

  <div class="card reveal" id="api-keys">
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">API Keys</h3>
    </div>
    <div id="apiKeysBody">
      <p class="card-sub">Loading…</p>
    </div>
  </div>
</main>

<script src="js/auth.js"></script>
<script src="js/app.js?v=byok-ui-polish"></script>
<script>
let currentProfile = null;

function initials(name, email) {
  const source = (name && name.trim()) || (email || '').split('@')[0] || '?';
  const parts = source.trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return '?';
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function formatMemberSince(createdAtIso) {
  try {
    const date = new Date(createdAtIso);
    if (isNaN(date.getTime())) {
      return '';
    }
    return `Member since ${date.toLocaleDateString(undefined, { year: 'numeric', month: 'long' })}`;
  } catch (e) {
    return '';
  }
}

function fillAccountForm(profile) {
  document.getElementById('fullName').value = profile.full_name || '';
  document.getElementById('phone').value = profile.phone || '';
  document.getElementById('location').value = profile.location || '';
  document.getElementById('headline').value = profile.headline || '';
  document.getElementById('bio').value = profile.bio || '';
}

function renderHeader(profile) {
  document.getElementById('profileAvatar').textContent = initials(profile.full_name, profile.email);
  document.getElementById('profileName').textContent = profile.full_name || profile.email.split('@')[0];
  document.getElementById('profileEmail').textContent = profile.email;
  document.getElementById('profileRoleTag').textContent = profile.user_type;
  document.getElementById('profileMemberSince').textContent = formatMemberSince(profile.created_at);
}

function renderRecruiterCard(profile) {
  const card = document.getElementById('roleCard');
  card.hidden = false;
  card.innerHTML = `
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">Company</h3>
    </div>
    <form id="companyForm">
      <div class="form-group">
        <label class="form-label" for="companyName">Company name</label>
        <input class="form-control" id="companyName" name="company_name" type="text" value="${(profile.company_name || '').replace(/"/g, '&quot;')}">
      </div>
      <div class="form-group">
        <label class="form-label" for="companyWebsite">Company website</label>
        <input class="form-control" id="companyWebsite" name="company_website" type="text" value="${(profile.company_website || '').replace(/"/g, '&quot;')}">
      </div>
      <div class="form-group">
        <label class="form-label" for="companyRole">Your role at the company</label>
        <input class="form-control" id="companyRole" name="company_role" type="text" value="${(profile.company_role || '').replace(/"/g, '&quot;')}">
      </div>
      <button type="submit" class="btn-primary">Save company details</button>
      <div class="form-status" id="companyFormStatus"></div>
    </form>
  `;

  document.getElementById('companyForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    const status = document.getElementById('companyFormStatus');
    status.textContent = '';
    status.className = 'form-status';
    try {
      const updated = await updateMyProfile({
        company_name: document.getElementById('companyName').value || null,
        company_website: document.getElementById('companyWebsite').value || null,
        company_role: document.getElementById('companyRole').value || null,
      });
      currentProfile = updated;
      status.textContent = 'Saved.';
      status.className = 'form-status success';
    } catch (err) {
      status.textContent = err.message || 'Could not save company details.';
      status.className = 'form-status error';
    }
  });
}

async function renderCandidateCard() {
  const card = document.getElementById('roleCard');
  card.hidden = false;
  card.innerHTML = `
    <div class="card-header">
      <h3 class="card-title" style="font-size:1.05rem;">Resume Summary</h3>
    </div>
    <p class="card-sub">Loading…</p>
  `;

  try {
    const candidate = await apiRequest('/candidates/me');
    const resume = candidate.resume || {};
    const skills = (resume.skills || []).concat(resume.technologies || []);
    const latestRole = (resume.work_experience || [])[0];
    const latestEducation = (resume.education || [])[0];

    // Static scaffolding is safe as innerHTML; resume-derived values are
    // user-controlled (from an uploaded resume) and must not be interpolated
    // into innerHTML - built with createElement/textContent instead, same
    // pattern as renderHeader().
    card.innerHTML = `
      <div class="card-header">
        <h3 class="card-title" style="font-size:1.05rem;">Resume Summary</h3>
        <a href="apply.html" class="tag">Update via resume</a>
      </div>
    `;

    if (resume.total_experience_years != null) {
      const p = document.createElement('p');
      p.className = 'card-sub';
      p.textContent = `${resume.total_experience_years} years of experience`;
      card.appendChild(p);
    }

    if (latestRole) {
      const p = document.createElement('p');
      p.className = 'card-sub';
      p.textContent = `Most recent: ${latestRole.position || ''}${latestRole.company ? ' at ' + latestRole.company : ''}`;
      card.appendChild(p);
    }

    if (latestEducation) {
      const p = document.createElement('p');
      p.className = 'card-sub';
      p.textContent = `Education: ${latestEducation.degree || ''}${latestEducation.institution ? ', ' + latestEducation.institution : ''}`;
      card.appendChild(p);
    }

    if (skills.length) {
      const row = document.createElement('div');
      row.className = 'chip-row';
      row.style.marginTop = '0.5rem';
      skills.forEach((s) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = s;
        row.appendChild(chip);
      });
      card.appendChild(row);
    } else {
      const p = document.createElement('p');
      p.className = 'card-sub';
      p.textContent = 'No skills on file yet.';
      card.appendChild(p);
    }
  } catch (err) {
    if (err.status === 404) {
      // No resume registered yet, a normal state (see GET /candidates/me).
      card.innerHTML = `
        <div class="card-header">
          <h3 class="card-title" style="font-size:1.05rem;">Resume Summary</h3>
        </div>
        <p class="card-sub">No resume on file yet.</p>
        <a href="apply.html" class="btn-outline">Upload your resume</a>
      `;
    } else {
      card.innerHTML = `
        <div class="card-header">
          <h3 class="card-title" style="font-size:1.05rem;">Resume Summary</h3>
        </div>
        <p class="card-sub">Could not load your resume summary.</p>
      `;
    }
  }
}

document.getElementById('accountForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = document.getElementById('accountFormStatus');
  status.textContent = '';
  status.className = 'form-status';
  try {
    const updated = await updateMyProfile({
      full_name: document.getElementById('fullName').value || null,
      phone: document.getElementById('phone').value || null,
      location: document.getElementById('location').value || null,
      headline: document.getElementById('headline').value || null,
      bio: document.getElementById('bio').value || null,
    });
    currentProfile = updated;
    renderHeader(updated);
    status.textContent = 'Saved.';
    status.className = 'form-status success';
  } catch (err) {
    status.textContent = err.message || 'Could not save your profile.';
    status.className = 'form-status error';
  }
});

document.getElementById('passwordForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const status = document.getElementById('passwordFormStatus');
  status.textContent = '';
  status.className = 'form-status';
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  try {
    await changeMyPassword(currentPassword, newPassword);
    status.textContent = 'Password changed.';
    status.className = 'form-status success';
    document.getElementById('passwordForm').reset();
  } catch (err) {
    status.textContent = err.message || 'Could not change your password.';
    status.className = 'form-status error';
  }
});

(async function init() {
  renderNavbar();
  try {
    currentProfile = await fetchMyProfile();
  } catch (err) {
    if (err.status === 401) {
      window.location.href = 'login.html';
      return;
    }
    const main = document.querySelector('main.container');
    if (main) {
      main.innerHTML = `
        <div class="card">
          <h3 class="card-title" style="font-size:1.05rem;">Could not load your profile</h3>
          <p class="card-sub">${err.message || 'Something went wrong loading your profile. Please try again later.'}</p>
        </div>
      `;
    }
    return;
  }
  renderHeader(currentProfile);
  fillAccountForm(currentProfile);
  if (currentProfile.user_type === 'recruiter') {
    renderRecruiterCard(currentProfile);
  } else {
    await renderCandidateCard();
  }
  await renderApiKeysCard(currentProfile);

  if (window.location.hash === '#api-keys') {
    document.getElementById('api-keys').scrollIntoView({ behavior: 'smooth' });
  }
})();
</script>
<script>
const BYOK_PROVIDERS = [
  { value: 'openai', label: 'OpenAI' },
  { value: 'gemini', label: 'Gemini' },
  { value: 'anthropic', label: 'Anthropic' },
  { value: 'groq', label: 'Groq' },
  { value: 'nvidia_nim', label: 'NVIDIA NIM' },
  { value: 'openrouter', label: 'OpenRouter' },
];

// Known Gemini model names with real free-tier quota (checked against
// Google AI Studio's usage dashboard); first entry is pre-selected.
const BYOK_GEMINI_MODELS = [
  'gemini-3.5-flash-lite',
  'gemini-3.8-flash',
  'gemini-3.5-flash',
  'gemini-3.6-flash',
  'gemini-3.7-flash',
  'gemini-3.1-flash-lite',
];

const BYOK_MODELS = {
  openai: ['gpt-4o-mini', 'gpt-4o', 'gpt-4.1-mini'],
  gemini: BYOK_GEMINI_MODELS,
  anthropic: ['claude-3-5-sonnet-latest', 'claude-3-5-haiku-latest', 'claude-3-7-sonnet-latest'],
  groq: ['openai/gpt-oss-20b', 'llama-3.3-70b-versatile'],
  nvidia_nim: ['nvidia/nemotron-3-super-120b-a12b'],
  openrouter: ['openai/gpt-4o-mini', 'anthropic/claude-3.5-sonnet'],
};

async function renderApiKeysCard(profile) {
  const container = document.getElementById('apiKeysBody');
  if (!profile || !['recruiter', 'candidate', 'admin'].includes(profile.user_type)) {
    container.innerHTML = '<p class="card-sub">Sign in to manage your AI provider settings.</p>'; return;
  }
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  try {
    const [credentials, settings, usage, health] = await Promise.all([apiRequest('/auth/me/llm-credentials'), apiRequest('/auth/me/llm-settings'), apiRequest('/auth/me/llm-usage'), apiRequest('/auth/me/llm-provider-health')]);
    const providers = BYOK_PROVIDERS.map(p => `<option value="${p.value}">${p.label}</option>`).join('');
    container.innerHTML = `<div class="byok-profile-intro"><p class="card-sub">Choose the AI credentials used by this account. ${profile.user_type === 'candidate' ? '<strong>Candidate BYOK is exclusively for mock interviews.</strong> Your keys are never used for real job applications, real job interviews, scoring or recruiter workflows.' : ''}</p></div>
      <section class="byok-preferences"><div class="byok-section-heading"><div><h4>AI provider mode</h4><p class="card-sub">Platform keeps using OpenHire credentials. BYOK uses your saved provider key.</p></div></div>
      <div class="form-group byok-mode-field"><label class="form-label" for="llmMode">Mode</label><select class="form-control" id="llmMode"><option value="platform">Platform</option><option value="byok">BYOK</option></select></div><div class="byok-preference-grid" id="byokPreferenceFields"><div class="form-group"><label class="form-label" for="llmProvider">Default provider</label><select class="form-control" id="llmProvider">${providers}</select></div><div class="form-group"><label class="form-label" for="llmDefault">Default credential</label><select class="form-control" id="llmDefault"></select></div><div class="form-group"><label class="form-label" for="llmModel">Default model</label><select class="form-control" id="llmModel"></select></div></div>
      <details class="byok-advanced" id="byokFallbackSettings"><summary>Fallback options</summary><label class="form-label"><input id="llmFallbackKeys" type="checkbox"> Try other saved keys if the default fails</label><label class="form-label"><input id="llmFallbackPlatform" type="checkbox"> Fall back to OpenHire platform credentials</label></details><div class="byok-settings-actions"><button class="btn-primary" id="saveLlmSettings" type="button">Save preferences</button><span id="llmSettingsStatus" class="form-status" aria-live="polite"></span></div></section>
      <section class="byok-credentials"><div class="byok-section-heading"><div><h4>Provider health</h4><p class="card-sub">Authentication and model access status for platform and saved credentials.</p></div></div><div class="byok-credential-list" id="byokProviderHealth"></div></section>
      <section class="byok-credentials"><div class="byok-section-heading"><div><h4>Saved API keys</h4><p class="card-sub">Credentials are encrypted and isolated to your account.</p></div><button class="btn-primary btn-sm" id="openAddLlm"><i class="ph-bold ph-plus"></i> Add API key</button></div><div id="savedLlmCredentials" class="byok-credential-list"></div></section>
      <section class="byok-usage"><h4>Usage</h4><div id="llmUsage"></div></section>
      <div class="modal-overlay byok-modal-overlay" id="credentialModal" hidden><div class="modal byok-modal" role="dialog" aria-modal="true" aria-labelledby="credentialModalTitle"><div class="modal-header"><div><h2 class="modal-title" id="credentialModalTitle">Add API key</h2><p class="card-sub">Add a provider credential to your account.</p></div><button type="button" class="btn-ghost modal-close" data-close aria-label="Close">&times;</button></div><form id="credentialForm"><div class="modal-body"><div class="form-group"><label class="form-label" for="credentialName">Key name</label><input class="form-control" id="credentialName" maxlength="80" placeholder="e.g. Hiring team key" required></div><div class="form-group"><label class="form-label" for="credentialProvider">Provider</label><select class="form-control" id="credentialProvider">${providers}</select></div><div class="form-group"><label class="form-label" for="credentialModel">Model</label><select class="form-control" id="credentialModel"></select></div><div class="form-group"><label class="form-label" for="credentialKey">API key</label><input class="form-control" id="credentialKey" type="password" autocomplete="new-password" placeholder="Paste your API key" required></div><div id="credentialFormStatus" class="form-status" aria-live="polite"></div></div><div class="byok-modal-actions"><button type="button" class="btn-outline" data-close>Cancel</button><button type="submit" class="btn-primary" id="credentialSubmit">Test and save key</button></div></form></div></div>`;
    const mode = document.getElementById('llmMode'), provider = document.getElementById('llmProvider'), defaultSelect = document.getElementById('llmDefault'), model = document.getElementById('llmModel');
    mode.value = settings.mode || 'platform'; provider.value = settings.provider || (credentials.find(c => c.credential_id === settings.default_credential_id) || {}).provider || 'openai';
    const refreshPreferences = (keep = true) => {
      const providerKeys = credentials.filter(c => c.provider === provider.value);
      defaultSelect.innerHTML = '<option value="">First active key</option>' + providerKeys.map(c => `<option value="${esc(c.credential_id)}">${esc(c.name)} - ${esc(c.key_hint)} - ${esc(c.status)}</option>`).join('');
      const savedId = settings.default_credential_id;
      defaultSelect.value = keep && providerKeys.some(c => c.credential_id === savedId) ? savedId : (providerKeys.find(c => c.status === 'active') || {}).credential_id || '';
      const selected = providerKeys.find(c => c.credential_id === defaultSelect.value), models = BYOK_MODELS[provider.value] || [];
      const selectedModel = keep ? (settings.model || selected?.model || '') : (selected?.model || '');
      model.innerHTML = models.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join('');
      if (selectedModel && !models.includes(selectedModel)) model.insertAdjacentHTML('afterbegin', `<option value="${esc(selectedModel)}">${esc(selectedModel)}</option>`);
      model.value = selectedModel || models[0] || '';
    };
    refreshPreferences();
    const syncModeFields = () => { const enabled = mode.value === 'byok'; document.getElementById('byokPreferenceFields').hidden = !enabled; document.getElementById('byokFallbackSettings').hidden = !enabled; };
    syncModeFields(); mode.onchange = syncModeFields; provider.onchange = () => refreshPreferences(false);
    const healthList = document.getElementById('byokProviderHealth');
    healthList.innerHTML = health.providers.map(item => `<article class="byok-credential-row"><div class="byok-credential-main"><div class="byok-credential-title"><strong>${esc(BYOK_PROVIDERS.find(p => p.value === item.provider)?.label || item.provider)} · ${esc(item.name)}</strong><span class="byok-status ${item.status === 'connected' ? 'is-active' : 'is-failed'}">${esc(item.status.replaceAll('_',' '))}</span></div><div class="byok-credential-meta"><span>Model: ${esc(item.model || 'Default')}</span><span>Auth: ${esc(item.auth_status)}</span><span>Last success: ${esc(item.last_successful_test_at || 'Never')}</span>${item.message ? `<span>${esc(item.message)}</span>` : ''}</div></div><div class="byok-credential-actions"><button type="button" class="btn-outline btn-sm" data-health-provider="${esc(item.provider)}" data-health-credential="${esc(item.credential_id || '')}">Test connection</button></div><span class="form-status" data-health-status="${esc(item.provider)}-${esc(item.credential_id || 'platform')}" aria-live="polite"></span></article>`).join('');
    healthList.querySelectorAll('[data-health-provider]').forEach(button => button.onclick = async () => { const providerName = button.dataset.healthProvider; const credentialId = button.dataset.healthCredential || 'platform'; const statusEl = button.parentElement.nextElementSibling; button.disabled = true; statusEl.textContent = 'Checking provider…'; try { const result = await apiRequest('/auth/me/llm-provider-health/test', {method:'POST', body:{provider:providerName, credential_id:credentialId}}); statusEl.textContent = result.message || result.status; statusEl.className = result.connected ? 'form-status success' : 'form-status error'; await renderApiKeysCard(profile); } catch (error) { statusEl.textContent = error.message; statusEl.className = 'form-status error'; button.disabled = false; } });
    defaultSelect.onchange = () => { const c = credentials.find(x => x.credential_id === defaultSelect.value); if (c?.model) model.value = c.model; };
    document.getElementById('llmFallbackKeys').checked = settings.fallback_to_other_keys !== false; document.getElementById('llmFallbackPlatform').checked = settings.fallback_to_platform !== false;
    const list = document.getElementById('savedLlmCredentials');
    list.innerHTML = credentials.length ? credentials.map(c => `<article class="byok-credential-row"><div class="byok-credential-main"><div class="byok-credential-title"><strong>${esc(c.name)}</strong><span class="byok-status ${c.health_status === 'connected' ? 'is-active' : 'is-failed'}">${esc(c.health_status.replaceAll('_',' '))}</span></div><div class="byok-credential-meta"><span>${esc(BYOK_PROVIDERS.find(p => p.value === c.provider)?.label || c.provider)}</span><code>${esc(c.key_hint)}</code><span>${esc(c.model || 'Provider default')}</span><span>Last success: ${esc(c.last_successful_test_at || 'Never')}</span></div></div><div class="byok-credential-actions"><button class="btn-outline btn-sm" data-default="${esc(c.credential_id)}">${settings.default_credential_id === c.credential_id ? 'Default' : 'Set default'}</button><button class="btn-outline btn-sm" data-test="${esc(c.credential_id)}">Test</button><button class="btn-outline btn-sm" data-edit="${esc(c.credential_id)}">Edit</button><button class="btn-outline btn-sm byok-delete" data-delete="${esc(c.credential_id)}">Delete</button></div><span class="form-status" id="keyStatus-${esc(c.credential_id)}" aria-live="polite"></span></article>`).join('') : `<div class="byok-empty"><strong>No API keys saved</strong><p class="card-sub">You can keep using Platform mode, or add a provider key to enable BYOK.</p><button type="button" class="btn-outline btn-sm" id="emptyAddLlm">Add API key</button></div>`;
    const modal = document.getElementById('credentialModal'), form = document.getElementById('credentialForm'), formStatus = document.getElementById('credentialFormStatus');
    const closeModal = () => { modal.hidden = true; form.reset(); form.dataset.editId = ''; document.getElementById('credentialKey').required = true; document.getElementById('credentialKey').placeholder = 'Paste your API key'; document.getElementById('credentialSubmit').textContent = 'Test and save key'; document.getElementById('credentialModalTitle').textContent = 'Add API key'; refreshCredentialModels(); };
    modal.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); modal.onclick = e => { if (e.target === modal) closeModal(); };
    const refreshCredentialModels = () => { const p = document.getElementById('credentialProvider').value; document.getElementById('credentialModel').innerHTML = (BYOK_MODELS[p] || []).map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join(''); };
    document.getElementById('credentialProvider').onchange = refreshCredentialModels; refreshCredentialModels();
    const openAdd = () => { form.reset(); form.dataset.editId = ''; document.getElementById('credentialKey').required = true; document.getElementById('credentialModalTitle').textContent = 'Add API key'; document.getElementById('credentialSubmit').textContent = 'Test and save key'; refreshCredentialModels(); modal.hidden = false; };
    document.getElementById('openAddLlm').onclick = openAdd; document.getElementById('emptyAddLlm')?.addEventListener('click', openAdd);
    document.querySelectorAll('[data-default]').forEach(b => b.onclick = async () => { const c = credentials.find(x => x.credential_id === b.dataset.default); if (!c) return; provider.value = c.provider; refreshPreferences(false); defaultSelect.value = c.credential_id; model.value = c.model || model.value; settings.provider = c.provider; settings.default_credential_id = c.credential_id; settings.model = c.model; await savePreferences(); });
    document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { const c = credentials.find(x => x.credential_id === b.dataset.edit); if (!c) return; form.dataset.editId = c.credential_id; document.getElementById('credentialName').value = c.name; document.getElementById('credentialProvider').value = c.provider; refreshCredentialModels(); document.getElementById('credentialModel').value = c.model || ''; document.getElementById('credentialKey').value = ''; document.getElementById('credentialKey').required = false; document.getElementById('credentialKey').placeholder = 'Leave blank to keep saved key'; document.getElementById('credentialModalTitle').textContent = 'Edit API key'; document.getElementById('credentialSubmit').textContent = 'Save changes'; modal.hidden = false; });
    document.querySelectorAll('[data-delete]').forEach(b => b.onclick = async () => { b.disabled = true; try { await apiRequest('/auth/me/llm-credentials/' + encodeURIComponent(b.dataset.delete), {method:'DELETE'}); await renderApiKeysCard(profile); } catch(e) { b.disabled = false; alert(e.message); } });
    document.querySelectorAll('[data-test]').forEach(b => b.onclick = async () => { const statusEl = document.getElementById('keyStatus-' + b.dataset.test); b.disabled = true; statusEl.textContent = 'Testing connection...'; statusEl.className = 'form-status'; try { const r = await apiRequest('/auth/me/llm-credential/test', {method:'POST', body:{credential_id:b.dataset.test}}); statusEl.textContent = r.success ? `Connected (${r.latency_ms}ms)` : (r.message || 'Connection failed'); statusEl.className = r.success ? 'form-status success' : 'form-status error'; await renderApiKeysCard(profile); } catch(e) { statusEl.textContent = e.message; statusEl.className = 'form-status error'; b.disabled = false; } });
    async function savePreferences() { const status = document.getElementById('llmSettingsStatus'); status.textContent = 'Saving...'; status.className = 'form-status'; try { const saved = await apiRequest('/auth/me/llm-settings', {method:'PUT', body:{mode:mode.value, provider:provider.value, default_credential_id:defaultSelect.value || null, fallback_to_other_keys:document.getElementById('llmFallbackKeys').checked, fallback_to_platform:document.getElementById('llmFallbackPlatform').checked, model:model.value || null}}); Object.assign(settings, saved); status.textContent = 'Preferences saved.'; status.className = 'form-status success'; list.querySelectorAll('[data-default]').forEach(x => { x.textContent = x.dataset.default === settings.default_credential_id ? 'Default' : 'Set default'; }); } catch(e) { status.textContent = e.message; status.className = 'form-status error'; } }
    document.getElementById('saveLlmSettings').onclick = savePreferences;
    form.onsubmit = async event => { event.preventDefault(); const submit = document.getElementById('credentialSubmit'); submit.disabled = true; formStatus.textContent = form.dataset.editId ? 'Saving credential...' : 'Testing and saving credential...'; formStatus.className = 'form-status'; const payload = {name:document.getElementById('credentialName').value.trim(), provider:document.getElementById('credentialProvider').value, model:document.getElementById('credentialModel').value || null}; const apiKey = document.getElementById('credentialKey').value.trim(); if (apiKey) payload.api_key = apiKey; try { if (form.dataset.editId) await apiRequest('/auth/me/llm-credentials/' + encodeURIComponent(form.dataset.editId), {method:'PATCH', body:payload}); else { payload.api_key = apiKey; await apiRequest('/auth/me/llm-credentials', {method:'POST', body:payload}); } await renderApiKeysCard(profile); } catch(e) { formStatus.textContent = e.message; formStatus.className = 'form-status error'; submit.disabled = false; } };
    document.getElementById('llmUsage').innerHTML = usage.length ? usage.map(u => `<p class="byok-usage-row">${esc(BYOK_PROVIDERS.find(p => p.value === u.provider)?.label || u.provider)} - ${esc((credentials.find(c => c.credential_id === u.credential_id) || {}).name || 'Deleted credential')} <span>${u.requests} requests - ${u.successes} successful - ${u.failures} failed - ${u.input_tokens}+${u.output_tokens} tokens</span></p>`).join('') : '<p class="card-sub">No usage recorded yet.</p>';
  } catch (err) {
    container.innerHTML = `<p class="card-sub">Could not load your API key settings: ${esc(err.message)}</p>`;
  }
}
</script>
</body>
</html>
