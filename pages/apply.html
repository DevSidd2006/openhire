<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Apply</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div style="max-width: 680px; margin: 1.5rem auto;" class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Apply with Resume</h2>
        <p class="card-sub" id="applyTargetJob">Target Role: —</p>
      </div>
      <button class="btn-outline" onclick="window.history.back()">Back</button>
    </div>

    <div class="form-group" style="margin-top:1.25rem;">
      <label class="form-label">Full Name</label>
      <input type="text" id="candidateName" class="form-control" placeholder="e.g. Alex Morgan" value="Alex Morgan">
    </div>

    <div class="form-group">
      <label class="form-label">Resume / CV Plaintext</label>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.4rem;">
        Paste your resume text. <code>ResumeParserAgent</code> will extract skills, education, and project claims.
      </p>
      <textarea id="resumeText" class="form-control" rows="9" placeholder="EXPERIENCE&#10;Software Engineer @ Acme Corp...&#10;&#10;SKILLS&#10;Python, FastAPI, Distributed Caching, PostgreSQL, Docker..."></textarea>
    </div>

    <button class="btn-primary" id="btnApply" style="width:100%; margin-top:0.5rem;" onclick="handleApplicationSubmit()">Submit Resume & Match Fit</button>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id');
  document.getElementById('applyTargetJob').textContent = jobId ? `Target Role: ${jobId}` : 'No job selected';
  if (!jobId) {
    document.getElementById('btnApply').disabled = true;
  }

  const user = getCurrentUser();
  if (user && user.name) {
    document.getElementById('candidateName').value = user.name;
  }

  async function handleApplicationSubmit() {
    const name = document.getElementById('candidateName').value.trim();
    const resume = document.getElementById('resumeText').value.trim();
    if (!name || !resume) {
      alert('Please fill out your name and resume text.');
      return;
    }

    const btn = document.getElementById('btnApply');
    btn.disabled = true;
    btn.textContent = 'Parsing Resume...';

    try {
      // 1. Register the candidate (ResumeParserAgent extracts skills/
      //    education/experience from the raw text server-side).
      const candidate = await apiRequest('/candidates', {
        method: 'POST',
        body: { candidate_name: name, resume_text: resume },
      });
      setCurrentUser(Object.assign({}, user, { role: 'candidate', candidate_id: candidate.candidate_id }));

      // 2. Create the application.
      btn.textContent = 'Submitting application...';
      const appResult = await apiRequest('/applications', {
        method: 'POST',
        body: { job_id: jobId, candidate_id: candidate.candidate_id },
      });
      const applicationId = appResult.application.application_id;

      // 3. Run matching for this job (ResumeMatcherAgent) - this scores
      //    every SUBMITTED application for the job, including ours.
      btn.textContent = 'Matching against rubric...';
      const matchResult = await apiRequest(`/jobs/${encodeURIComponent(jobId)}/match`, { method: 'POST' });
      const ourApplication = matchResult.applications.find(a => a.application_id === applicationId) || appResult.application;

      const matchPct = ourApplication.matching_score ? Math.round(ourApplication.matching_score.match_score * 100) : null;

      if (ourApplication.status !== 'shortlisted') {
        alert(`Thanks for applying!${matchPct !== null ? ` Match score: ${matchPct}%.` : ''} This role isn't a strong enough match right now, so no interview will be scheduled.`);
        window.location.href = 'candidate.html';
        return;
      }

      // 4. Shortlisted - start the adaptive interview session.
      btn.textContent = 'Starting interview...';
      const sessionId = await ensureInterviewSession(ourApplication);
      alert(`Resume parsed! Match score: ${matchPct}%. Launching interview.`);
      window.location.href = `interview.html?session_id=${encodeURIComponent(sessionId)}&app_id=${encodeURIComponent(applicationId)}`;
    } catch (err) {
      alert(`Could not submit your application: ${err.message}`);
      btn.disabled = false;
      btn.textContent = 'Submit Resume & Match Fit';
    }
  }
</script>
</body>
</html>
