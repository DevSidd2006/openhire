<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenHire — Apply for Job</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="navbarContainer"></div>

<main class="container">
  <div style="max-width: 720px; margin: 0 auto;" class="card">
    <div class="card-header">
      <div>
        <h2 class="card-title">Apply with Resume</h2>
        <p class="card-sub" id="applyTargetJob">Target Position: —</p>
      </div>
      <button class="btn-outline" onclick="window.history.back()">Cancel</button>
    </div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <input type="text" id="candidateName" class="form-control" placeholder="e.g. Alex Morgan" value="Alex Morgan">
    </div>

    <div class="form-group">
      <label class="form-label">Resume Plaintext / CV Content</label>
      <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.4rem;">
        Paste your resume text. The <code>ResumeParserAgent</code> will extract skills, education, and project claims.
      </p>
      <textarea id="resumeText" class="form-control" rows="10" placeholder="EXPERIENCE&#10;Software Engineer @ Acme Corp...&#10;&#10;SKILLS&#10;Python, FastAPI, Postgres, Docker..."></textarea>
    </div>

    <button class="btn-primary" id="btnApply" style="width:100%;" onclick="handleApplicationSubmit()">Submit Resume & Match Fit</button>
  </div>
</main>

<script src="js/app.js"></script>
<script>
  renderNavbar();

  const urlParams = new URLSearchParams(window.location.search);
  const jobId = urlParams.get('job_id') || 'backend-lead-01';
  document.getElementById('applyTargetJob').textContent = `Target Position: ${jobId}`;

  const user = getCurrentUser();
  if (user && user.name) {
    document.getElementById('candidateName').value = user.name;
  }

  function handleApplicationSubmit() {
    const name = document.getElementById('candidateName').value.trim();
    const resume = document.getElementById('resumeText').value.trim();
    if (!name || !resume) {
      alert('Please fill out your name and resume text.');
      return;
    }

    const btn = document.getElementById('btnApply');
    btn.disabled = true;
    btn.textContent = 'Parsing Resume (ResumeParserAgent)...';

    const apps = getStoredApplications();
    const newApp = {
      application_id: 'app-' + Date.now(),
      candidate_name: name,
      job_id: jobId,
      resume_text: resume,
      match_score: Math.floor(Math.random() * 14 + 84),
      status: 'SHORTLISTED',
      session_id: 'session-' + Date.now()
    };

    apps.unshift(newApp);
    saveApplications(apps);

    setTimeout(() => {
      alert(`Resume parsed! Match score: ${newApp.match_score}%. Proceeding to candidate dashboard.`);
      window.location.href = `interview.html?session_id=${newApp.session_id}&app_id=${newApp.application_id}`;
    }, 800);
  }
</script>
</body>
</html>
