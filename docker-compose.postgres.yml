services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openhire
      POSTGRES_PASSWORD: openhire
      POSTGRES_DB: openhire
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./repositories/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhire"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
