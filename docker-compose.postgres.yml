services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: openhire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: openhire
      POSTGRES_USER: openhire
      POSTGRES_PASSWORD: openhire_dev_password
    ports:
      - "5433:5432"
    volumes:
      - openhire_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhire -d openhire"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  openhire_postgres_data:
